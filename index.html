/* ---------- Routage ---------- */
const view=document.getElementById('view'), topbar=document.getElementById('top'), tabs=document.getElementById('tabs');
const TABS=[['seances','Séances',I.cal],['blocs','Blocs',I.layers],['exos','Exercices',I.ex],['joueurs','Joueurs','<span class="emo" aria-hidden="true">👥</span>'],['favs','Favoris',I.star],['outils','Outils',I.tools]];
let route='seances', trail=[], scrollMem={};
let q='', filt='all', onlyMain=false;
function tabOf(r){const h=r.split(':')[0];return {seances:'seances',seance:'seances',plan:'seances',blocs:'blocs',bloc:'blocs',grille:'blocs',cr:'blocs',exos:'exos',exo:'exos',favs:'favs',outils:'outils',tests:'outils',fiche:'outils',joueurs:'joueurs',joueur:'joueurs',plateau:'seances',lundi:'outils',terrain:'outils',principes:'outils',legende:'outils','plan-img':'exos'}[h]||'seances'}
function go(r,opts){
  scrollMem[route]=window.scrollY;
  const isTab=TABS.some(t=>t[0]===r);
  if(isTab) trail=[]; else if(!(opts&&opts.replace)) trail.push(route);
  route=r; render();
  if(pendingScroll){const el=document.getElementById(pendingScroll);pendingScroll=null;if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0)}
  else window.scrollTo(0,isTab?(scrollMem[r]||0):0);
  try{history.pushState({r},'')}catch(e){}
}
function back(){
  if(!trail.length) return;
  const r=trail.pop(); route=r; render(); window.scrollTo(0,scrollMem[r]||0);
}
window.addEventListener('popstate',()=>{ if(trail.length) back(); });

/* ---------- Barre du haut et onglets ---------- */
function renderChrome(title,opts){
  opts=opts||{};
  const canBack=trail.length>0 && !TABS.some(t=>t[0]===route);
  topbar.innerHTML=(canBack?`<button class="iconbtn" data-back aria-label="Retour">${I.back}</button>`:'<img class="logo" src="img/logo.png" alt="FC Marmande 47">')+
    `<div style="flex:1;min-width:0">${canBack?'':'<div class="brand">FC Marmande 47 · U8</div>'}<h1>${esc(title)}</h1></div>`+(opts.right||'');
  try{window.__u8pill&&window.__u8pill()}catch(e){}
  const cur=tabOf(route);
  tabs.innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t[0]}" ${t[0]===cur?'aria-current="page"':''}>${t[2]}<span>${t[1]}</span></button>`).join('');
}

/* ---------- Vues ---------- */
/* Si un écran plante, on affiche un message simple au lieu d'une page vide */
function render(){
  try{renderView()}catch(e){
    try{console.error(e)}catch(_){}
    try{renderChrome('Oups')}catch(_){}
    view.innerHTML='<div class="empty"><b>Cet écran a un souci</b>Tes données sont gardées. Reviens aux séances.<br><br><button class="btn" data-tab="seances">Retour aux séances</button></div>';
  }
}
function renderView(){
  const [h,a,b]=route.split(':');
  let html='';
  if(h==='seances') html=vSeances();
  else if(h==='seance') html=vSeance(a);
  else if(h==='plan') html=vPlan(a,+b);
  else if(h==='exos') html=vExos();
  else if(h==='exo') html=vExo(+a);
  else if(h==='favs') html=vFavs();
  else if(h==='outils') html=vOutils();
  else if(h==='tests') html=vTests();
  else if(h==='lundi') html=vLundi();
  else if(h==='terrain') html=vTerrain();
  else if(h==='principes') html=vPrincipes();
  else if(h==='legende') html=vLegende();
  else if(h==='plan-img') html=vImg(route.slice(9));
  else if(h==='blocs') html=vBlocs();
  else if(h==='bloc') html=vBloc(a);
  else if(h==='fiche') html=vFiche(a);
  else if(h==='grille') html=vGrille(a);
  else if(h==='cr') html=b?vCr(a,b):vCrList(a);
  else if(h==='joueurs') html=vJoueurs();
  else if(h==='joueur') html=vJoueur(a);
  else if(h==='plateau') html=vPlateau(a);
  view.innerHTML='<div class="fade">'+html+'</div>';
  if(h==='exos') bindSearch();
  view.querySelectorAll('textarea.grow').forEach(growTA);
  if(pendingFocus){const el=view.querySelector(pendingFocus);pendingFocus=null;if(el){el.focus();try{el.scrollIntoView({block:'center'})}catch(e){}}}
}

/* Accueil : séances */

function vSeances(){

  const t=todayISO(), nx=nextSeance();
  let h='<div class="stack">';

  if(nx){
    const d=daysBetween(t,nx.date), when=d===0?"Aujourd'hui":d===1?'Demain':`Dans ${d} jours`;

    const ss=SE.filter(s=>s.bloc===bn);
    const open=nx?nx.bloc===bn:bn===blocs[0];
    h+=`<section class="bloc" id="bloc-${bn}"><header><div class="eyebrow">${ss.length} séances</div><h2>${BLOCS[bn]}</h2><div class="muted" style="font-weight:700;font-size:.9rem">${esc(fmt(ss[0].date,{day:'numeric',month:'long'}))} → ${esc(fmt(ss[ss.length-1].date,{day:'numeric',month:'long',year:'numeric'}))}</div></header>`;
    const weeks=[...new Set(ss.map(s=>s.semaine))];
    weeks.forEach(w=>{
      const ws=ss.filter(s=>s.semaine===w);
      h+=`<div class="week"><h3>Semaine ${w} · ${esc(ws[0].theme)}</h3>`;
      ws.concat(PLAT.filter(p=>p.sem===bn+'-'+w)).sort((x,y)=>x.date<y.date?-1:1).forEach(s=>{
        if(s.plateau){h+=platRow(s);return;}
        const past=s.date<t, next=nx&&nx.id===s.id;
        const names=s.items.filter(i=>i.titre&&!/^CONSIGNES$/i.test(i.titre)).map(i=>i.titre).join(' · ');
        h+=`<button class="srow ${past?'past':''} ${next?'next':''}" data-go="seance:${s.id}"><span class="dateblock"><small>${esc(shortDay(s.date))}</small><b>${dt(s.date).getDate()}</b><em>${esc(fmt(s.date,{month:'short'}).replace('.',''))}</em></span><span class="mid"><b>${esc(cap(fmt(s.date,{weekday:'long'})))}</b><span>${esc(names)}</span></span><span class="dur">${esc(s.duree)}${(()=>{const c=sessCount(s.id);return c.p+c.a?`<small class="pc">👥 ${c.p}/${players.length}</small>`:''})()}</span></button>`;
      });
      h+='</div>';
    });
    h+=platRows(bn);
    h+='</section>';
  });
  return h;
}

/* Détail d'une séance */
function vSeance(id){
  const s=SEID[id]; renderChrome(cap(fmt(s.date,{weekday:'long',day:'numeric',month:'long'})));
  const dn=done[id]||[];
  let h=`<div class="stack"><section class="sbanner">${PITCH}<div class="eyebrow" style="color:#cfd9ff">${BLOCS[s.bloc]} · séance ${s.n_bloc} sur ${s.total_bloc}</div><h2>${esc(longDate(s.date))}</h2><div class="row"><span class="chip">Semaine ${s.semaine} · ${esc(s.theme)}</span><span class="chip">${esc(s.duree)}</span></div></section>`;
  if(s.calendrier) h+=`<div class="note"><span><b>Calendrier.</b> ${esc(s.calendrier)}</span></div>`;
  h+=nextPlat(s);
  if(s.nouveau) h+=`<div class="note"><span><b>Nouveau aujourd'hui.</b> ${xref(s.nouveau)}</span></div>`;
  h+='</div>'+attSection(id)+'<div class="sec"><h2>Déroulé</h2><div class="timeline">';
  s.items.forEach((it,i)=>{
    const cat=it.num?catOf(it.num):(/test/i.test(it.titre)?'technique':/consigne/i.test(it.titre)?'planb':'jeux');
    const tick=dn.includes(i);
    const hr=it.heure.replace(' et ',' · ');
    const dur=it.duree?(/×/.test(it.duree)?it.duree+' min':it.duree+' min'):'';
    const tags=it.tags.map(t=>t==='NOUVEAU'?'<span class="tag">Nouveau</span>':t==='CE QUI CHANGE'?'<span class="tag alt">Ce qui change</span>':'<span class="tag pause">'+esc(t)+'</span>').join('');
    h+=`<div class="step cat-${cat} ${tick?'done':''}"><div class="when"><button class="tick" data-done="${id}:${i}" aria-label="Marquer comme fait" aria-pressed="${tick}">${I.check}</button><b>${esc(hr.split(' · ')[0])}</b><small>${esc(dur)}${hr.includes(' · ')?'<br>puis '+esc(hr.split(' · ')[1]):''}</small></div>
    <${it.num?`button data-go="exo:${it.num}"`:'div'} class="scard">${tags?`<div class="tags">${tags}</div>`:''}<h3>${esc(it.titre)}</h3>${it.qui?`<p class="qui">${xref(it.qui)}</p>`:''}${it.consigne?`<div class="bubble">« ${esc(it.consigne)} »</div>`:''}${it.plus?`<p style="margin-top:8px">${xref(it.plus)}</p>`:''}${it.num?`<span class="go">Voir la fiche ${I.next}</span>`:''}</${it.num?'button':'div'}></div>`;
  });
  h+='</div></div>';
  if(s.planb&&s.planb.length){
    h+=`<div class="sec"><div class="planb"><h3>Plan B · si besoin</h3>${s.planb.map(l=>l.startsWith('→')?`<p class="arrow">${xref(l,1)}</p>`:`<p>${xref(l,1)}</p>`).join('')}<p class="muted" style="font-style:italic;margin-top:8px">Même durée, même place dans la séance.</p></div></div>`;
  }
  if(s.pauses) h+=`<div class="sec"><div class="note"><span>${esc(s.pauses)}</span></div></div>`;
  if(s.plans.length){
    h+=`<div class="sec"><h2>Plans d'installation</h2><div class="plans">${s.plans.map((p,k)=>`<button class="plan-th" data-go="plan:${id}:${k}"><img src="${p.img}" alt="" loading="lazy"><div>${esc(p.titre)}<small>${esc(planWhen(p.titre,k,s))}</small></div></button>`).join('')}</div></div>`;
  }

  return h;

/* Liste d'exercices */
function exMatches(e){
  if(filt==='passe'){if(!PASSE.includes(e.num)) return false} else if(filt!=='all'&&e.categorie!==filt) return false;
  if(onlyMain&&!e.principal) return false;
  if(!q) return true;
  const hay=norm([e.num,e.titre,CATS[e.categorie],e.objectif,e.consigne,e.materiel,e.installation].join(' '));
  return norm(q).split(/\s+/).every(w=>hay.includes(w));
}
function card(e){
  return `<button class="ex cat-${e.categorie}" data-go="exo:${e.num}"><span class="thumb"><img src="${e.img}" alt="" loading="lazy"><span class="num">${e.num}</span>${favs.has(e.num)?`<span class="star">${I.starF}</span>`:''}</span><span class="meta"><b>${esc(e.titre)}</b><span>${esc(CATS[e.categorie])}${e.duree?' · '+esc(e.duree):''}</span></span></button>`;
}
function vExos(){
  renderChrome('Exercices');
  return `<div class="search"><label class="sbox">${I.search}<input id="q" type="search" placeholder="Chercher un exercice…" value="${esc(q)}" autocomplete="off" aria-label="Chercher un exercice"></label>
  <div class="hscroll filters" id="filters">${filtersHTML()}</div></div><div id="exlist">${listHTML()}</div>`;
}
function filtersHTML(){
  const E=Object.entries(CATS); E.splice(2,0,['passe','Passe']); const all=[['all','Tous']].concat(E);
  return all.map(([k,l])=>`<button class="fchip cat-${k}" data-filter="${k}" aria-pressed="${filt===k}">${k!=='all'?'<i></i>':''}${l}</button>`).join('')+
    `<button class="fchip" data-main aria-pressed="${onlyMain}">Principaux</button>`;
}
function listHTML(){
  const l=D.exercices.filter(exMatches);
  if(!l.length) return `<div class="empty"><b>Aucun exercice trouvé</b>Essaie un autre mot, ou enlève un filtre.</div>`;
  return `<div class="count">${l.length} exercice${l.length>1?'s':''}</div><div class="grid">${l.map(card).join('')}</div>`;
}
function bindSearch(){
  const inp=document.getElementById('q');

let mt=store.get('mt',{});                 // mt[idPlateau]={done,list:[{id,opp,sf,sa,g:{joueur:n},a:{joueur:n}}]}
let confirmM=null;
const saveMt=()=>store.set('mt',mt);
const getM=pid=>mt[pid]||{done:false,list:[]};
const edM=pid=>mt[pid]||(mt[pid]={done:false,list:[]});
const pnOf=id=>{const p=players.find(x=>x.id===id);return p?pname(p):''};
const cntOf=(o,k)=>(o&&o[k])||0;
const resOf=x=>x.sf>x.sa?'v':x.sf<x.sa?'d':'n';
const RESL={v:'Victoire',n:'Match nul',d:'Défaite'};
function namesOf(o){
  return Object.keys(o||{}).filter(k=>o[k]>0&&players.some(p=>p.id===k)).sort((a,b)=>o[b]-o[a]||pnOf(a).localeCompare(pnOf(b),'fr')).map(k=>pnOf(k)+(o[k]>1?' ×'+o[k]:'')).join(', ');
}
function mTotals(pid){
  let g=0,a=0; Object.keys(mt).forEach(k=>mt[k].list.forEach(x=>{g+=cntOf(x.g,pid);a+=cntOf(x.a,pid)})); return {g,a};
}
const anyMatch=()=>Object.keys(mt).some(k=>mt[k].list.length);
function mKpis(pid){
  if(!anyMatch()) return '';
  const t=mTotals(pid);
  return `<div class="kpis k2"><div><b>${t.g}</b><span>⚽ buts</span></div><div><b>${t.a}</b><span>🅰️ passes déc.</span></div></div>`;
}
function stp(act,pid,mid,x,val,big,icon,lab){
  const k=(d)=>`${act}|${pid}|${mid}|${x||''}|${d}`;
  return `<span class="stp${big?' big':''}">${icon?`<span class="e" aria-hidden="true">${icon}</span>`:''}<button data-mt="${k(-1)}" aria-label="${esc(lab)} : retirer un">−</button><i>${val}</i><button class="inc" data-mt="${k(1)}" aria-label="${esc(lab)} : ajouter un">+</button></span>`;
}
function bestOf(o){
  const ks=Object.keys(o).filter(k=>o[k]>0&&players.some(p=>p.id===k)); if(!ks.length) return null;
  const mx=Math.max(...ks.map(k=>o[k]));
  return {n:mx,names:ks.filter(k=>o[k]===mx).map(pnOf).sort((a,b)=>a.localeCompare(b,'fr')).join(', ')};
}
function mStats(pid){
  const m=getM(pid); const S={V:0,N:0,D:0,bf:0,ba:0,G:{},A:{}};
  m.list.forEach(x=>{const r=resOf(x); if(r==='v')S.V++; else if(r==='n')S.N++; else S.D++; S.bf+=x.sf; S.ba+=x.sa;
    Object.keys(x.g||{}).forEach(k=>S.G[k]=(S.G[k]||0)+x.g[k]); Object.keys(x.a||{}).forEach(k=>S.A[k]=(S.A[k]||0)+x.a[k]);});
  return S;
}
function matchSection(pid){
  const m=getM(pid), L=sortedPlayers();
  let h=`<div class="sec" id="matchs"><h2><span aria-hidden="true">⚽</span> Matchs</h2>`;
  if(m.done) return h+matchReport(pid)+'</div>';
  if(!m.list.length) h+=`<div class="empty" style="padding:4px 6px 8px"><b>Aucun match noté</b>Ajoute un match pour noter le score, les buts et les passes décisives.</div>`;
  m.list.forEach((x,i)=>{
    const rows=L.filter(p=>attOf(pid,p.id)==='p'||cntOf(x.g,p.id)||cntOf(x.a,p.id));
    h+=`<div class="mcard"><div class="mhd"><b>Match ${i+1}</b>${confirmM===x.id?`<button class="btn danger mini" data-mt="delm|${pid}|${x.id}">Supprimer ce match ?</button>`:`<button class="chip" data-mt="delm|${pid}|${x.id}" aria-label="Supprimer le match ${i+1}">${I.trash.replace('<svg','<svg style="width:16px;height:16px"')} Supprimer</button>`}</div>`;
    h+=`<input class="inp" data-mopp="${pid}|${x.id}" value="${esc(x.opp||'')}" placeholder="Adversaire (facultatif)" autocomplete="off" aria-label="Adversaire du match ${i+1}">`;
    h+=`<div class="scoreb"><div class="side"><small>Nous</small>${stp('sf',pid,x.id,'',x.sf,1,'','Score de notre équipe')}</div><b class="dash">–</b><div class="side"><small>Eux</small>${stp('sa',pid,x.id,'',x.sa,1,'','Score adverse')}</div></div>`;
    if(rows.length){
      h+=`<div class="mleg"><span>⚽ But</span><span>🅰️ Passe décisive</span></div>`+rows.map(p=>`<div class="mp"><span class="nm">${esc(pname(p))}</span>${stp('g',pid,x.id,p.id,cntOf(x.g,p.id),0,'⚽','Buts de '+pname(p))}${stp('a',pid,x.id,p.id,cntOf(x.a,p.id),0,'🅰️','Passes décisives de '+pname(p))}</div>`).join('');
    } else h+=`<p class="muted" style="font-size:.9rem;margin-top:4px">Marque d'abord les joueurs présents dans « Présence » ci-dessus pour noter leurs buts et leurs passes décisives.</p>`;
    h+='</div>';
  });
  h+=`<button class="addp" data-mt="addm|${pid}">${I.plus} Ajouter un match</button>`;
  if(m.list.length) h+=`<button class="btn fin" data-mt="done|${pid}">${I.check} Terminer le plateau</button><p class="saved" style="text-align:center">Le compte-rendu match par match s'affiche une fois le plateau terminé.</p>`;
  return h+'</div>';
}
function matchReport(pid){
  const m=getM(pid), S=mStats(pid), L=sortedPlayers();
  const pres=L.filter(p=>attOf(pid,p.id)==='p').length;
  let h=`<div class="note donebar"><span>${I.check} <b>Plateau terminé.</b> Voici le compte-rendu, match après match.</span></div>`;
  h+=m.list.map((x,i)=>{
    const r=resOf(x), bt=namesOf(x.g), ps=namesOf(x.a);
    return `<div class="mcard rep"><div class="mhd"><b>Match ${i+1}${x.opp&&x.opp.trim()?` · ${esc(x.opp.trim())}`:''}</b><span class="tag ${r}">${RESL[r]}</span></div><div class="bigscore"><span>Nous</span><b>${x.sf}</b><i>–</i><b>${x.sa}</b><span>Eux</span></div>${bt?`<p><b>⚽ Buteurs.</b> ${esc(bt)}</p>`:''}${ps?`<p><b>🅰️ Passes décisives.</b> ${esc(ps)}</p>`:''}${!bt&&!ps?'<p class="muted">Aucun buteur noté.</p>':''}</div>`;
  }).join('');
  const bg=bestOf(S.G), ba=bestOf(S.A);
  h+=`<div class="card"><h3 style="font:600 1.1rem var(--f-display);margin-bottom:10px">Bilan du plateau</h3><div class="kpis k4"><div><b>${m.list.length}</b><span>matchs</span></div><div><b>${S.V}-${S.N}-${S.D}</b><span>V-N-D</span></div><div><b>${S.bf}-${S.ba}</b><span>buts</span></div><div><b>${pres}/${players.length}</b><span>présents</span></div></div>${bg?`<p style="margin-top:12px"><b>Meilleur buteur.</b> ${esc(bg.names)} (${bg.n})</p>`:''}${ba?`<p style="margin-top:6px"><b>Meilleur passeur.</b> ${esc(ba.names)} (${ba.n})</p>`:''}</div>`;
  h+=`<div class="row" style="margin-top:12px"><button class="btn" data-mt="copy|${pid}">${I.copy||''} Copier le compte-rendu</button><button class="chip" data-mt="reopen|${pid}">Rouvrir pour modifier</button></div><div id="mtout"></div>`;
  return h;
}
function reportText(pid){
  const s=PLID[pid], m=getM(pid), S=mStats(pid), L=sortedPlayers();
  const pres=L.filter(p=>attOf(pid,p.id)==='p').length;
  const T=[`Compte-rendu du plateau · ${s.titre}`,`FC Marmande 47 · U8 · ${longDate(s.date)} ${dt(s.date).getFullYear()}`,`Joueurs présents : ${pres} sur ${players.length}`,''];
  m.list.forEach((x,i)=>{
    T.push(`Match ${i+1}${x.opp&&x.opp.trim()?' contre '+x.opp.trim():''} : ${x.sf}-${x.sa} (${RESL[resOf(x)].toLowerCase()})`);
    const bt=namesOf(x.g), ps=namesOf(x.a); if(bt) T.push('Buteurs : '+bt); if(ps) T.push('Passes décisives : '+ps); T.push('');
  });
  T.push(`Bilan : ${S.V} victoire${S.V>1?'s':''}, ${S.N} nul${S.N>1?'s':''}, ${S.D} défaite${S.D>1?'s':''} · ${S.bf} but${S.bf>1?'s':''} marqué${S.bf>1?'s':''}, ${S.ba} encaissé${S.ba>1?'s':''}`);
  const bg=bestOf(S.G), ba=bestOf(S.A); if(bg) T.push(`Meilleur buteur : ${bg.names} (${bg.n})`); if(ba) T.push(`Meilleur passeur : ${ba.names} (${ba.n})`);
  if((rem[pid]||'').trim()) T.push('','Remarque : '+rem[pid].trim());
  return T.join('\n');
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-mt]');
  const parts=t?t.dataset.mt.split('|'):[];
  const same=t&&confirmM&&parts[0]==='delm'&&parts[2]===confirmM;
  if(confirmM&&!same){confirmM=null; if(!t&&route.startsWith('plateau:')) keep();}
  if(!t) return;
  ev.preventDefault();
  const [act,P,M,X,d]=parts, m=edM(P);
  if(act==='addm') m.list.push({id:newId(),opp:'',sf:0,sa:0,g:{},a:{}});
  else if(act==='delm'){ if(confirmM===M){m.list=m.list.filter(x=>x.id!==M); confirmM=null;} else {confirmM=M; keep(); return;} }
  else if(act==='done') m.done=true;
  else if(act==='reopen') m.done=false;
  else if(act==='copy'){
    const txt=reportText(P), old=t.innerHTML;
    copyText(txt).then(ok=>{
      if(ok){t.innerHTML=I.check+' Copié !'; setTimeout(()=>{t.innerHTML=old},1800)}
      else{const o=document.getElementById('mtout'); if(o){o.innerHTML='<p class="muted" style="font-size:.88rem;margin:10px 0 6px">Copie automatique impossible : sélectionne le texte ci-dessous.</p><textarea class="ta" readonly></textarea>'; const ta=o.querySelector('textarea'); ta.value=txt; growTA(ta); ta.focus(); ta.select();}}
    });
    return;
  }
  else{
    const x=m.list.find(y=>y.id===M); if(!x) return;
    const dd=+d;
    if(act==='sf'||act==='sa') x[act]=Math.max(0,Math.min(99,x[act]+dd));
    else if(act==='g'||act==='a'){
      const o=x[act], cur=o[X]||0, nv=Math.max(0,Math.min(30,cur+dd));
      if(nv!==cur){ if(nv) o[X]=nv; else delete o[X]; if(act==='g') x.sf=Math.max(0,x.sf+(nv-cur)); }
    }
  }
  saveMt(); keep();
});
document.addEventListener('input',ev=>{
  const t=ev.target; if(!t||!t.dataset||!t.dataset.mopp) return;
  const [P,M]=t.dataset.mopp.split('|'), x=mt[P]&&mt[P].list.find(y=>y.id===M);
  if(x){x.opp=t.value; saveMt();}
});

function crText(n,pid){
  const p=players.find(x=>x.id===pid), b=B[n];
  const L=[`Compte-rendu · ${pname(p)}`,`FC Marmande 47 · U8 · ${b.periode}`,''];

  const rows=progressRows(n,pid).filter(r=>r.vals.some(v=>String(v).trim()!==''));
  if(rows.length){L.push('Ses progrès :');rows.forEach(r=>L.push('- '+r.t.lab+' ('+r.t.sub+') : '+B[n].camps.map((c,i)=>PER[c][0]+' '+(String(r.vals[i]).trim()||'–')).join(' · ')));L.push('')}
  if(g('travail')) L.push((b.suite?"Ce qu'on va travailler au "+b.suite:"Ce qu'on va travailler ensuite")+' :',g('travail'),'');
  const ns=CRN.filter(([k])=>getCr(n,pid,k));
  if(ns.length) L.push('Notes : '+ns.map(([k,l])=>l+' '+getCr(n,pid,k)+'/5').join(' · '),'');
  if(g('mot')) L.push("Le mot de l'éducateur :",g('mot'));
  return L.join('\n').trim();
}

}

/* ---------- Événements ---------- */
const keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-back],[data-tab],[data-fav],[data-done],[data-filter],[data-main],[data-img],[data-zoom],[data-theme-toggle],[data-chk],[data-ok],[data-addp],[data-addname],[data-addbulk],[data-delp],[data-note],[data-copy],[data-seances],[data-resetchk],[data-att],[data-attall]');
  if(confirmDel&&!(t&&t.dataset.delp)){confirmDel=null; if(route==='joueurs'||route.startsWith('joueur:')) keep();}
  if(!t) return;
  ev.preventDefault();
  const d=t.dataset;
  if(d.go) go(d.go,{replace:'rep' in d});
  else if('back' in d) back();
  else if(d.tab) go(d.tab);
  else if(d.fav){const n=+d.fav; favs.has(n)?favs.delete(n):favs.add(n); store.set('favs',[...favs]); render();}
  else if(d.done){
    const [id,i]=d.done.split(':'); const a=new Set(done[id]||[]); const k=+i; a.has(k)?a.delete(k):a.add(k); done[id]=[...a]; store.set('done',done); keep();
  }
  else if(d.filter){filt=d.filter; document.getElementById('filters').innerHTML=filtersHTML(); document.getElementById('exlist').innerHTML=listHTML();}
  else if('main' in d){onlyMain=!onlyMain; document.getElementById('filters').innerHTML=filtersHTML(); document.getElementById('exlist').innerHTML=listHTML();}
  else if(d.img) go('plan-img:'+d.img);
  else if('zoom' in d){const b=document.getElementById('pbox'); b.classList.toggle('big'); t.textContent=b.classList.contains('big')?'Réduire le plan':'Agrandir le plan';}
  else if('themeToggle' in d){const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme=dark?'light':'dark';}
  else if(d.chk){chk[d.chk]=!chk[d.chk]; store.set('chk',chk); keep();}
  else if('resetchk' in d){Object.keys(chk).forEach(k=>delete chk[k]); store.set('chk',chk); keep();}
  else if(d.ok){const [p,per]=d.ok.split('|'); sv(p,per,'ok',!gv(p,per,'ok')); keep();}
  else if('addp' in d){const id=newId(); players.push({id,name:''}); store.set('players',players); pendingFocus='[data-pname="'+id+'"]'; render();}
  else if('addname' in d){const i=document.getElementById('newp'); const v=i?i.value.trim():''; if(v){players.push({id:newId(),name:v}); store.set('players',players);} pendingFocus='#newp'; render();}
  else if('addbulk' in d){const i=document.getElementById('bulkp'); const l=i?i.value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean):[]; l.forEach(nm=>players.push({id:newId(),name:nm})); store.set('players',players); render();}
  else if(d.delp){ if(confirmDel===d.delp){delPlayer(d.delp); confirmDel=null; if(route.startsWith('joueur:')){go('joueurs');return;}} else confirmDel=d.delp; keep(); }
  else if(d.att){const [s,p]=d.att.split('|'); cycleAtt(s,p); keep();}
  else if(d.attall){const [s,m]=d.attall.split('|'); setAllAtt(s,m); keep();}
  else if(d.note){const [b,p,k,v]=d.note.split('|'); setCr(b,p,k,+getCr(b,p,k)===+v?'':+v); keep();}
  else if(d.seances){pendingScroll='bloc-'+d.seances; go('seances');}
  else if(d.copy){
    const [n,p]=d.copy.split('|'), txt=crText(n,p), old=t.innerHTML;
    copyText(txt).then(ok=>{
      if(ok){t.innerHTML=I.check+' Copié !'; setTimeout(()=>{t.innerHTML=old},1800)}
      else{const o=document.getElementById('copyout'); if(o){o.innerHTML='<p class="muted" style="font-size:.88rem;margin-bottom:6px">Copie automatique impossible : sélectionne le texte ci-dessous.</p><textarea class="ta" readonly></textarea>'; const ta=o.querySelector('textarea'); ta.value=txt; growTA(ta); ta.focus(); ta.select();}}
    });
  }
});

/* ---------- Sauvegarde : export / import (mêmes clés u8:…, rien n'est renommé) ---------- */
const BK=['favs','done','players','res','cr','rem','chk','att','mt'];
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const bkOk={favs:Array.isArray,players:v=>Array.isArray(v)&&v.every(p=>isObj(p)&&typeof p.id==='string'&&typeof p.name==='string'),done:isObj,res:isObj,cr:isObj,rem:isObj,chk:isObj,att:isObj,mt:isObj};
const bkMsg=t=>{const m=document.getElementById('bkmsg'); if(m) m.textContent=t};
function bkExport(){
  const data={}; BK.forEach(k=>{data[k]=store.get(k,k==='favs'||k==='players'?[]:{})});
  const out={app:'carnet-u8',version:1,date:new Date().toISOString(),data};
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='carnet-u8-sauvegarde-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    bkMsg('Sauvegarde créée : '+players.length+' joueur'+(players.length>1?'s':'')+'. Cherche le fichier dans tes téléchargements.');
  }catch(e){bkMsg("Impossible de créer le fichier sur ce téléphone.")}
}
function bkImport(file){
  const r=new FileReader();
  r.onerror=()=>bkMsg('Fichier illisible.');
  r.onload=()=>{
    let o; try{o=JSON.parse(r.result)}catch(e){return bkMsg("Ce fichier n'est pas une sauvegarde valide.")}
    if(!isObj(o)||o.app!=='carnet-u8'||!isObj(o.data)) return bkMsg("Ce fichier n'est pas une sauvegarde du carnet U8.");
    const keys=BK.filter(k=>k in o.data);
    if(!keys.length||keys.some(k=>!bkOk[k](o.data[k]))) return bkMsg('Sauvegarde abîmée : rien n\'a été changé.');
    const n=o.data.players?o.data.players.length:0;
    if(!confirm('Remplacer les données de ce téléphone par la sauvegarde ('+n+' joueur'+(n>1?'s':'')+') ?')) return bkMsg('Annulé : rien n\'a été changé.');
    try{keys.forEach(k=>localStorage.setItem('u8:'+k,JSON.stringify(o.data[k]))); keys.forEach(k=>{try{window.__u8touch&&window.__u8touch(k)}catch(e){}})}catch(e){return bkMsg('Ce téléphone refuse d\'enregistrer. Rien n\'a été restauré.')}
    location.reload();
  };
  r.readAsText(file);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-bk]'); if(!t) return;
  ev.preventDefault();
  if(t.dataset.bk==='export') bkExport();
  else{const f=document.getElementById('bkfile'); if(f){f.value=''; f.click();}}
});
document.addEventListener('change',ev=>{
  const t=ev.target; if(t&&t.id==='bkfile'&&t.files&&t.files[0]) bkImport(t.files[0]);
});

render();
try{history.replaceState({r:route},'')}catch(e){}
};
</script>

<script>
/* ---------- Connexion + synchronisation (Supabase) ----------
   Clé publique (publishable) : OK dans le code. Aucune clé secrète, aucun mot de passe ici.
   Les données sont protégées côté serveur (RLS : owner = auth.uid()). */
(function(){
'use strict';
const SB_URL='https://drmtdpzijxuijpuupkxe.supabase.co';
const SB_KEY='sb_publishable_5O77tduW5hxthJv9FB33qQ_pxVaXl2c';
const KEYS=['favs','done','players','res','cr','rem','chk','att','mt'];
const AUTHKEY='u8-auth';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};
let sb=null, session=null, started=false, enabled=false, busy=false, loggingOut=false, recovery=false, status='off';
let timer=null, retryT=null, lastEmail='';

/* ---------- Outils de données locales ---------- */
const getDirty=()=>{try{const a=JSON.parse(ls.get('u8meta:dirty')||'[]');return Array.isArray(a)?a.filter(k=>KEYS.includes(k)):[]}catch(e){return []}};
const setDirty=a=>ls.set('u8meta:dirty',JSON.stringify([...new Set(a)]));
const tsOf=k=>ls.get('u8meta:ts:'+k);
const ms=s=>{const t=Date.parse(s||'');return Number.isFinite(t)?t:0};
const localVal=k=>{const r=ls.get('u8:'+k); if(r==null) return undefined; try{return JSON.parse(r)}catch(e){return undefined}};
const filled=v=>Array.isArray(v)?v.length>0:(v!==null&&typeof v==='object'?Object.keys(v).length>0:false);
const hasLocalData=()=>KEYS.some(k=>filled(localVal(k)));
function wipe(prefixes){
  try{const del=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&prefixes.some(p=>k.startsWith(p))) del.push(k)} del.forEach(k=>localStorage.removeItem(k))}catch(e){}
}
const wipeData=()=>wipe(['u8:','u8meta:']);
const wipeAuth=()=>wipe([AUTHKEY]);

/* ---------- Indicateur ---------- */
const LABEL={sync:'Synchronisé',pending:'Envoi…',offline:'Hors-ligne',off:'Non synchronisé',err:"Erreur d'envoi"};
function paint(){
  document.querySelectorAll('.syncpill').forEach(p=>{p.className='syncpill s-'+status; p.innerHTML='<i></i>'; p.appendChild(document.createTextNode(LABEL[status]))});
}
function setStatus(s){status=s; paint()}
window.__u8pill=()=>{
  const t=$('top');
  if(t&&!t.querySelector('.syncpill')){const s=document.createElement('span'); s.setAttribute('role','status'); s.className='syncpill'; t.appendChild(s)}
  paint();
};
window.__u8email=()=>(session&&session.user&&session.user.email)||'';

/* ---------- Erreurs en français ---------- */
const isNet=e=>!navigator.onLine||!e||e.status===0||e.name==='TypeError'||e.name==='AuthRetryableFetchError'||/failed to fetch|network|load failed/i.test(String(e.message||e));
const isAuth=e=>!!e&&(e.status===401||e.code==='PGRST301'||/jwt|not authenticated|refresh token/i.test(String(e.message||'')));
function frErr(e){
  const m=String((e&&e.message)||'');
  if(isNet(e)) return 'Pas de réseau. Vérifie ta connexion et réessaie.';
  if(/invalid login|invalid credentials/i.test(m)) return 'Email ou mot de passe incorrect.';
  if(/not confirmed/i.test(m)) return "Cet email n'est pas encore confirmé. Préviens la personne qui gère les comptes.";
  if((e&&e.status===429)||/rate limit|too many|security purposes/i.test(m)) return "Trop d'essais. Attends quelques minutes puis réessaie.";
  if(/different from the old/i.test(m)) return "Choisis un mot de passe différent de l'ancien.";
  if(/at least|weak|short/i.test(m)) return 'Mot de passe trop court ou trop faible.';
  if(/expired|otp|invalid.*(token|link)/i.test(m)) return 'Ce lien a expiré. Demande un nouveau lien.';
  if(/session/i.test(m)) return 'Ta session a expiré. Reconnecte-toi.';
  return 'Une erreur est survenue. Réessaie dans un instant.';
}

/* ---------- Écran de connexion ---------- */
let gateMode='';
const say=(t,kind)=>{const m=$('gmsg'); if(m){m.textContent=t||''; m.className='gmsg'+(kind==='ok'?' ok':'')}};
const lock=(f,on)=>{const b=f&&f.querySelector('button[type=submit]'); if(b) b.disabled=on};
function hideGate(){$('gate').hidden=true; $('app').hidden=false}
function showGate(mode,msg){
  gateMode=mode;
  const g=$('gate'); $('app').hidden=true; g.hidden=false; g.scrollTop=0;
  const m='<p class="gmsg" id="gmsg" role="alert"></p>';
  let h='';
  if(mode==='loading') h='<p class="gtxt">Chargement…</p>';
  else if(mode==='login') h=
    '<form id="fLogin" novalidate><label for="gEmail">Email</label><input class="inp" id="gEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">'+
    '<label for="gPass">Mot de passe</label><input class="inp" id="gPass" type="password" autocomplete="current-password">'+m+
    '<button class="btn gbtn" type="submit">Se connecter</button></form><button class="glink" id="gForgot" type="button">Mot de passe oublié ?</button>';
  else if(mode==='forgot') h=
    '<p class="gtxt">Écris ton email : tu recevras un lien pour choisir un nouveau mot de passe.</p>'+
    '<form id="fForgot" novalidate><label for="gEmail">Email</label><input class="inp" id="gEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">'+m+
    '<button class="btn gbtn" type="submit">Envoyer le lien</button></form><button class="glink" id="gBack" type="button">Retour à la connexion</button>';
  else if(mode==='newpw') h=
    '<p class="gtxt">Choisis un nouveau mot de passe (8 caractères minimum).</p>'+
    '<form id="fNew" novalidate><label for="gP1">Nouveau mot de passe</label><input class="inp" id="gP1" type="password" autocomplete="new-password">'+
    '<label for="gP2">Encore une fois</label><input class="inp" id="gP2" type="password" autocomplete="new-password">'+m+
    '<button class="btn gbtn" type="submit">Enregistrer</button></form>';
  else if(mode==='retry') h=m+'<button class="btn gbtn" id="gRetry" type="button">Réessayer</button><button class="glink" id="gOut" type="button">Se déconnecter</button>';
  else if(mode==='cloud'||mode==='empty') h=
    '<p class="gtxt">'+(mode==='empty'
      ?'Ton compte est encore vide, mais ce téléphone contient déjà des données (joueurs, présences, notes…).'
      :'Ce téléphone contient des données. Si tu les importes, elles remplacent celles du compte pour les mêmes rubriques.')+'</p>'+
    '<button class="btn gbtn" id="gImport" type="button">Importer mes données de ce téléphone</button>'+
    '<button class="btn alt gbtn" id="gLater" type="button">Pas maintenant</button><p class="gtxt">Rien n\'est supprimé sur ce téléphone.</p>';
  g.innerHTML='<div class="gbox"><img class="logo" src="img/logo.png" alt="" width="72" height="72"><div class="eyebrow">FC Marmande 47 · U8</div><h1>Carnet de terrain U8</h1>'+h+'</div>';
  if(msg) say(msg,mode==='forgot'&&/envoy/i.test(msg)?'ok':'');
  const em=$('gEmail'); if(em&&lastEmail) em.value=lastEmail;

  const on=(id,ev,fn)=>{const x=$(id); if(x) x.addEventListener(ev,fn)};
  on('fLogin','submit',async ev=>{
    ev.preventDefault(); const f=ev.target;
    const em=$('gEmail').value.trim(), pw=$('gPass').value;
    if(!em||!pw) return say('Écris ton email et ton mot de passe.');
    lastEmail=em; lock(f,true); say('');
    try{const r=await sb.auth.signInWithPassword({email:em,password:pw}); if(r.error) throw r.error; session=r.data.session; await enter()}
    catch(e){lock(f,false); say(frErr(e))}
  });
  on('gForgot','click',()=>{lastEmail=($('gEmail')||{}).value||lastEmail; showGate('forgot')});
  on('gBack','click',()=>{lastEmail=($('gEmail')||{}).value||lastEmail; showGate('login')});
  on('fForgot','submit',async ev=>{
    ev.preventDefault(); const f=ev.target; const em=$('gEmail').value.trim();
    if(!em) return say('Écris ton email.');
    lastEmail=em; lock(f,true); say('');
    try{
      const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
      if(r.error) throw r.error;
      say("Si cet email est connu, un message vient d'être envoyé. Regarde aussi dans les courriers indésirables.",'ok');
    }catch(e){say(frErr(e))}
    lock(f,false);
  });
  on('fNew','submit',async ev=>{
    ev.preventDefault(); const f=ev.target; const a=$('gP1').value, b=$('gP2').value;
    if(a.length<8) return say('Le mot de passe doit avoir au moins 8 caractères.');
    if(a!==b) return say('Les deux mots de passe ne sont pas les mêmes.');
    lock(f,true); say('');
    try{
      const r=await sb.auth.updateUser({password:a}); if(r.error) throw r.error;
      recovery=false; try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
      const s=await sb.auth.getSession(); session=s.data.session;
      if(!session) return showGate('login','Mot de passe changé. Connecte-toi.');
      await enter();
    }catch(e){lock(f,false); say(frErr(e))}
  });
  on('gRetry','click',()=>{ if(sb&&session) enter(); else location.reload() });
  on('gOut','click',()=>logout(true));
  const f0=g.querySelector('input'); if(f0&&!f0.value&&mode!=='loading'){ try{f0.focus({preventScroll:true})}catch(e){} }
}
function askImport(serverHas){
  return new Promise(res=>{
    showGate(serverHas?'cloud':'empty');
    $('gImport').onclick=()=>res('import'); $('gLater').onclick=()=>res('later');
  });
}

/* ---------- Lecture / fusion (le plus récent gagne, clé par clé) ---------- */
async function pullRows(){
  const r=await sb.from('carnet_data').select('key,value,updated_at').eq('owner',session.user.id).in('key',KEYS);
  if(r.error) throw r.error;
  return r.data||[];
}
function reconcile(rows,imp){
  const srv={}; rows.forEach(r=>{srv[r.key]=r});
  let changed=0, dirty=getDirty();
  KEYS.forEach(k=>{
    const s=srv[k], lv=localVal(k), has=lv!==undefined, lt=ms(tsOf(k)), isD=dirty.includes(k);
    if(imp&&filled(lv)){ ls.set('u8meta:ts:'+k,new Date().toISOString()); dirty.push(k); return }   // le téléphone gagne (choix de l'utilisateur)
    if(s){
      const st=ms(s.updated_at);
      if(has&&isD&&lt>=st) return;           // local plus récent : sera envoyé
      if(has&&!isD&&lt&&lt>=st) return;      // déjà identique
      const nv=JSON.stringify(s.value);      // le serveur est plus récent
      if(!has||ls.get('u8:'+k)!==nv) changed++;
      ls.set('u8:'+k,nv); ls.set('u8meta:ts:'+k,s.updated_at); dirty=dirty.filter(x=>x!==k);
    }else if(has&&filled(lv)){
      if(!lt) ls.set('u8meta:ts:'+k,new Date().toISOString());
      dirty.push(k);                         // seulement sur le téléphone : à envoyer
    }
  });
  setDirty(dirty);
  return changed;
}

/* ---------- Entrée dans l'app ---------- */
function resume(){
  hideGate();
  if(!started){started=true; try{window.__u8start()}catch(e){try{console.error(e)}catch(_){}}}
  if(!enabled) setStatus('off');
  else if(!navigator.onLine) setStatus('offline');
  else setStatus(getDirty().length?'pending':'sync');
  window.__u8pill();
  if(enabled) flush();
}
async function enter(){
  const uid=session.user.id, owner=ls.get('u8meta:owner');
  if(owner&&owner!==uid){ wipeData(); if(started){location.reload(); return} }   // autre compte : on efface, rien ne fuit
  showGate('loading');
  let rows=null;
  try{rows=await pullRows()}
  catch(e){
    if(isAuth(e)) return showGate('login','Ta session a expiré. Reconnecte-toi : tes données non envoyées sont gardées.');
    if(!isNet(e)) return showGate('retry',"Impossible de lire tes données pour l'instant.");
  }
  const mine=ls.get('u8meta:owner')===uid;
  if(rows===null){
    if(!mine) return showGate('retry','Pas de réseau. Connecte-toi à internet pour ouvrir ton compte la première fois.');
    enabled=true; return resume();           // hors-ligne : on travaille avec le cache
  }
  let imp=false;
  if(!mine&&hasLocalData()){
    const c=await askImport(rows.length>0);
    if(c==='later'){enabled=false; return resume()}
    imp=true;
  }
  const changed=reconcile(rows,imp);
  ls.set('u8meta:owner',uid); enabled=true;
  if(started&&changed){location.reload(); return}
  resume();
}

/* ---------- Envoi ---------- */
window.__u8touch=k=>{
  if(!KEYS.includes(k)) return;
  ls.set('u8meta:ts:'+k,new Date().toISOString());
  setDirty(getDirty().concat(k));
  if(enabled){setStatus(navigator.onLine?'pending':'offline'); schedule()}
};
function schedule(){clearTimeout(timer); timer=setTimeout(()=>flush(),1000)}
function scheduleRetry(){clearTimeout(retryT); retryT=setTimeout(()=>flush(),20000)}
async function flush(retried){
  if(!enabled||!session||busy||!started) return;
  const dirty=getDirty().filter(k=>ls.get('u8:'+k)!=null);
  if(!dirty.length){setDirty([]); setStatus('sync'); return}
  if(!navigator.onLine){setStatus('offline'); scheduleRetry(); return}
  busy=true; setStatus('pending');
  const sent={};
  const rows=dirty.map(k=>{
    const ts=tsOf(k)||new Date().toISOString(); sent[k]=ts;
    return {owner:session.user.id,key:k,value:localVal(k),updated_at:ts};
  });
  try{
    const r=await sb.from('carnet_data').upsert(rows,{onConflict:'owner,key'});
    if(r.error) throw r.error;
    busy=false;
    const left=getDirty().filter(k=>!(k in sent&&tsOf(k)===sent[k]));
    setDirty(left);
    if(left.length){setStatus('pending'); schedule()} else setStatus('sync');
  }catch(e){
    busy=false;
    if(isAuth(e)){
      if(!retried){
        try{const r=await sb.auth.refreshSession(); if(r.data&&r.data.session){session=r.data.session; return flush(true)}}catch(x){}
      }
      session=null; setStatus('offline');
      return showGate('login','Ta session a expiré. Reconnecte-toi : tes données non envoyées sont gardées.');
    }
    if(isNet(e)){setStatus('offline'); scheduleRetry(); return}
    setStatus('err'); scheduleRetry();
  }
}
window.addEventListener('online',()=>{ if(started&&enabled) flush() });
window.addEventListener('offline',()=>{ if(started&&enabled) setStatus('offline') });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&started&&enabled&&getDirty().length) flush() });

/* ---------- Déconnexion ---------- */
async function logout(force){
  if(!force&&getDirty().length&&!confirm("Des changements n'ont pas encore été envoyés. Si tu te déconnectes maintenant, ils seront perdus. Te déconnecter quand même ?")) return;
  loggingOut=true;
  try{ const r=await sb.auth.signOut(); if(r&&r.error) await sb.auth.signOut({scope:'local'}) }
  catch(e){ try{await sb.auth.signOut({scope:'local'})}catch(_){} }
  wipeData(); wipeAuth();
  location.reload();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-logout]'); if(!b) return;
  ev.preventDefault(); logout(false);
});

/* ---------- Démarrage ---------- */
function boot(){
  const h=location.hash||'';
  recovery=/type=recovery/.test(h);
  const linkErr=/error_code=|error=/.test(h);
  if(!window.supabase||!window.supabase.createClient){
    return showGate('retry','Impossible de charger le service de connexion. Vérifie ta connexion internet.');
  }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:AUTHKEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(()=>{session=s; if(gateMode!=='newpw') showGate('newpw')},0) }
    else if(ev==='SIGNED_OUT'){
      if(loggingOut) return;
      session=null;
      setTimeout(()=>showGate('login',started?'Ta session a expiré. Reconnecte-toi : tes données non envoyées sont gardées.':''),0);
    }
    else if(s) session=s;
  });
  showGate('loading');
  sb.auth.getSession().then(async r=>{
    session=r.data&&r.data.session;
    if(linkErr){ try{history.replaceState(null,'',location.pathname+location.search)}catch(e){} return showGate('forgot','Ce lien a expiré ou a déjà servi. Demande un nouveau lien.') }
    if(recovery&&session) return showGate('newpw');
    if(!session) return showGate('login');
    lastEmail=session.user.email||'';
    await enter();
  }).catch(()=>showGate('retry','Impossible de joindre le service de connexion. Vérifie ta connexion internet.'));
}
boot();
})();
</script>
