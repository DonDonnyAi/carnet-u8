<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fd1"><link rel="icon" href="img/logo.png"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; connect-src https://drmtdpzijxuijpuupkxe.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carnet de terrain U8</title>
<style>
/* Polices dans le dossier fonts/ : marche sans réseau */
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/nunito-italic.woff2) format('woff2')}
</style>
<style>
/* Concept : un carnet d'éducateur au bord du terrain, aux couleurs du FC Marmande : bleu roi et blanc.
   Barre bleue avec le logo, fonds blancs, schémas verts mis en avant, une couleur par catégorie d'exercice. */
:root{
  --bg:#ffffff; --card:#ffffff; --soft:#eef3ff; --ink:#0d1b4c; --muted:#56668f; --line:#d9e3fb;
  --club:#1f4fd1; --club-dark:#1a3fa8; --club-ink:#1f4fd1; --star:#f5b400; --pitch:#2a7140;
  --c-echauffement:#e07a10; --c-technique:#1f4fd1; --c-duel:#d23c35; --c-jeux:#8346d1; --c-placement:#0f9279; --c-match:#2a9448; --c-planb:#66769a;
  --shadow:0 0 0 1px var(--line),0 6px 16px -10px rgba(31,79,209,.35);
  --topH:66px;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1230; --card:#111d47; --soft:#17275d; --ink:#eef2ff; --muted:#9fb1e0; --line:#243568;
  --club:#2f5fe8; --club-dark:#2549b8; --club-ink:#b9ccff; --star:#ffc933;
  --shadow:0 0 0 1px var(--line),0 8px 18px -12px rgba(0,0,0,.7);
  --c-echauffement:#ff9a3d; --c-technique:#7ea0ff; --c-duel:#ff7a72; --c-jeux:#b58aff; --c-placement:#3cd0b0; --c-match:#58d17a; --c-planb:#9db0d8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1230; --card:#111d47; --soft:#17275d; --ink:#eef2ff; --muted:#9fb1e0; --line:#243568;
  --club:#2f5fe8; --club-dark:#2549b8; --club-ink:#b9ccff; --star:#ffc933;
  --shadow:0 0 0 1px var(--line),0 8px 18px -12px rgba(0,0,0,.7);
  --c-echauffement:#ff9a3d; --c-technique:#7ea0ff; --c-duel:#ff7a72; --c-jeux:#b58aff; --c-placement:#3cd0b0; --c-match:#58d17a; --c-planb:#9db0d8;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--club);outline-offset:2px;border-radius:8px}
.cat-echauffement{--c:var(--c-echauffement)} .cat-technique{--c:var(--c-technique)} .cat-duel{--c:var(--c-duel)}
.cat-jeux{--c:var(--c-jeux)} .cat-placement{--c:var(--c-placement)} .cat-match{--c:var(--c-match)} .cat-planb{--c:var(--c-planb)}
.soft{background:color-mix(in srgb,var(--c) 14%,var(--card))}

/* Coque */
#app{min-height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--club);color:#fff;min-height:var(--topH);box-shadow:0 6px 14px -10px rgba(10,30,110,.7)}
.top .logo{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff;background:#fff}
.top .iconbtn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.top .iconbtn.on{background:#fff;color:var(--star)}
.top h1{font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{font:800 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#cfdcff;margin-bottom:3px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{background:var(--star);color:#3a2a00}
main{flex:1;padding:14px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs-in{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;width:100%;max-width:560px;padding:6px;border-radius:28px;background:var(--card);box-shadow:0 10px 30px -10px rgba(10,20,50,.35),0 0 0 1px var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:22px;font:800 .72rem/1.1 var(--f-body);color:var(--muted);transition:background .15s,color .15s}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{background:var(--club);color:#fff}

/* Éléments communs */
.eyebrow{font:800 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 11px;border-radius:99px;font:700 .8rem/1.2 var(--f-body);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap}
.chip.cat{background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.chip.gold{background:var(--club);color:#fff;box-shadow:none}
.tag{font:800 .72rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--club);color:#fff}
.tag.alt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--club-ink);color:var(--club-ink)}
.tag.pause{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec>h2{font-size:1.15rem}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;font:600 1.15rem var(--f-display);color:var(--ink);margin-bottom:4px}
.xref{display:inline-block;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--club) 15%,var(--card));color:var(--club-ink);font-weight:800;font-size:.85em;text-decoration:none}

/* Séances : accueil */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;background:linear-gradient(160deg,var(--club),var(--club-dark));color:#fff;isolation:isolate;box-shadow:0 14px 30px -14px color-mix(in srgb,var(--club) 80%,#000)}
.hero svg.pitch{position:absolute;right:-30px;bottom:-26px;width:78%;height:auto;opacity:.13;z-index:-1;pointer-events:none}
.hero .eyebrow{color:#cfd9ff}
.hero .btn{margin-top:2px}
.hero h2{font-size:1.9rem;margin:6px 0 2px}
.hero .sub{color:#dbe4ff;font-weight:600}
.hero ol{list-style:none;margin:14px 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.hero li{display:flex;gap:10px;align-items:baseline;font-weight:700}
.hero li span{font:600 .8rem var(--f-body);color:#b9c8f6;min-width:2.6em;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;font:800 1rem var(--f-body);background:var(--club);color:#fff;box-shadow:0 4px 0 var(--club-dark)}
.hero .btn,.sbanner .btn{background:#fff;color:var(--club);box-shadow:0 4px 0 rgba(10,30,110,.45)}
.btn:active{transform:translateY(2px)}
.promo{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:20px;background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--club)}
.promo svg{color:var(--club)}
.promo b{font:600 1.1rem var(--f-display);display:block}
.promo span.s{font-weight:600;font-size:.92rem}
.promo svg{width:34px;height:34px;flex:none}
.bloc{margin-top:26px}
.bloc>header{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.bloc>header h2{font-size:1.3rem}
.week{margin-top:14px}
.week>h3{font:800 .78rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px 10px 10px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:8px}
.srow.past{opacity:.55}
.srow.next{box-shadow:inset 0 0 0 2.5px var(--club),var(--shadow)}
.dateblock{flex:none;width:54px;border-radius:14px;padding:7px 0 6px;text-align:center;background:var(--soft);color:var(--club-ink)}
.dateblock small{display:block;font:800 .72rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em}
.dateblock b{display:block;font:700 1.45rem/1.05 var(--f-display)}
.dateblock em{display:block;font:700 .72rem/1 var(--f-body);font-style:normal;text-transform:uppercase}
.srow .mid{flex:1;min-width:0}
.srow .mid b{display:block;font-weight:800}
.srow .mid span{display:block;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .dur{font:700 .85rem var(--f-body);color:var(--muted);flex:none}

/* Séance : détail */
.sbanner{border-radius:26px;padding:18px;background:linear-gradient(160deg,var(--club),var(--club-dark));color:#fff;position:relative;overflow:hidden;isolation:isolate}
.sbanner svg.pitch{position:absolute;right:-30px;bottom:-30px;width:70%;opacity:.2;z-index:-1}
.sbanner h2{font-size:1.75rem;margin:6px 0 10px}
.sbanner .chip{background:rgba(255,255,255,.14);box-shadow:none;color:#fff}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:.93rem}
.note b{font-weight:800}
.timeline{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.step{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.when{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.when b{font:700 1.02rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.when small{font:700 .72rem var(--f-body);color:var(--muted);text-align:center;line-height:1.15}
.tick{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--line);display:grid;place-items:center;color:transparent;background:var(--card)}
.tick svg{width:18px;height:18px}
.step.done .tick{background:var(--c-match);box-shadow:none;color:#fff}
.step.done .scard{opacity:.6}
.scard{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px 12px;border-left:6px solid var(--c,var(--c-planb))}
.scard h3{font-size:1.08rem;margin:5px 0 6px}
.scard .tags{display:flex;gap:6px;flex-wrap:wrap}
.scard p{font-size:.92rem;color:var(--ink)}
.scard .qui{color:var(--muted)}
.bubble{position:relative;margin-top:9px;padding:9px 12px;border-radius:14px;background:var(--soft);font-weight:700;font-size:.95rem}
.bubble::before{content:"";position:absolute;left:18px;top:-7px;width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
.scard .go{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font:800 .82rem var(--f-body);color:var(--club-ink)}
.planb{background:var(--soft);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.planb h3{font-size:1.1rem;margin-bottom:8px}
.planb p{font-size:.93rem;margin-bottom:5px}
.planb p.arrow{font-weight:800}
.plans{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scroll-snap-type:x mandatory}
.plan-th{flex:none;width:210px;scroll-snap-align:start;text-align:left;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.plan-th img{display:block;width:100%;height:120px;object-fit:cover}
.plan-th div{padding:9px 12px 11px;font-weight:800;font-size:.9rem;line-height:1.2}
.plan-th small{display:block;color:var(--muted);font-weight:600;font-size:.76rem;margin-top:2px}

/* Exercices */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH));z-index:15;padding:6px 0 8px;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -16px;padding-inline:16px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:0 16px;height:48px;box-shadow:var(--shadow)}
.sbox svg{width:20px;height:20px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:none;color:inherit;font:600 1rem var(--f-body);outline:none;height:100%}
.filters{margin-top:10px}
.fchip{flex:none;padding:8px 14px;border-radius:99px;font:800 .85rem var(--f-body);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:inline-flex;align-items:center;gap:7px}
.fchip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.fchip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}
.count{margin:12px 2px 8px;font:700 .85rem var(--f-body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ex{position:relative;display:block;text-align:left;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.ex .thumb{position:relative;display:block;aspect-ratio:16/10;background:var(--pitch);border-bottom:4px solid var(--c)}
.ex .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;left:8px;top:8px;min-width:30px;height:30px;padding:0 7px;border-radius:99px;background:var(--c);color:#fff;font:700 .95rem/30px var(--f-display);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.star{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--star);color:#3a2a00;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.star svg{width:16px;height:16px}
.ex .meta{display:block;padding:9px 12px 12px}
.ex .meta b{display:block;font:600 1rem/1.15 var(--f-display);min-height:2.3em}
.ex .meta span{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}

/* Fiche exercice */
.diagram{position:relative;display:block;width:100%;border-radius:22px;overflow:hidden;background:var(--pitch);box-shadow:var(--shadow);border-bottom:6px solid var(--c)}
.diagram img{display:block;width:100%;height:auto}
.diagram .zoom{position:absolute;right:10px;bottom:12px;padding:6px 11px;border-radius:99px;background:rgba(10,20,40,.7);color:#fff;font:800 .75rem var(--f-body)}
.ftitle{display:flex;gap:12px;align-items:flex-start;margin:16px 0 10px}
.ftitle .num{position:static;flex:none;width:44px;min-width:44px;height:44px;line-height:44px;font-size:1.3rem;padding:0}
.ftitle h2{font-size:1.65rem}
.ask{position:relative;margin:16px 0 4px;padding:16px 18px;border-radius:22px;background:var(--club);color:#fff}
.ask::after{content:"";position:absolute;left:30px;bottom:-9px;width:20px;height:20px;background:var(--club);transform:rotate(45deg);border-radius:4px}
.ask .eyebrow{color:#cfdcff}
.ask p{font:600 1.35rem/1.25 var(--f-display);margin-top:6px}
.field h2{font-size:1.05rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 .95rem var(--f-display)}
.steps li span{padding-top:3px}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.gs{grid-template-columns:1fr}}
.gcard{border-radius:18px;padding:12px 14px;background:var(--card);box-shadow:var(--shadow)}
.gcard .eyebrow{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--club);color:#fff;margin-bottom:6px}
.gcard.g2 .eyebrow{background:color-mix(in srgb,var(--club) 22%,var(--card));color:var(--club-ink)}
.err{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c-duel) 10%,var(--card));margin-bottom:8px}
.err b{font-weight:800}
.err q{display:block;margin-top:5px;font-weight:700;quotes:none;color:var(--ink)}
.err q::before{content:"À dire : ";font-weight:800;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
details.acc{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:800}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.acc .in img{display:block;width:100%;border-radius:14px;background:var(--pitch)}
.lev{font-size:.86rem;color:var(--muted);font-weight:700}
.kv{font-size:.95rem}.kv b{display:block;font:800 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.used{display:flex;flex-wrap:wrap;gap:6px}
.used button{padding:6px 11px;border-radius:99px;background:var(--soft);font:700 .82rem var(--f-body)}
.rtable{width:100%;border-collapse:collapse;font-size:.88rem}
.rtable th{font:800 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--muted);padding:6px 8px 6px 0}
.rtable td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.rtable td:first-child{font-weight:800;white-space:nowrap}

/* Plan d'installation */
.planview .imgbox{border-radius:20px;overflow:auto;background:var(--pitch);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.planview .imgbox img{display:block;width:100%;max-width:none;height:auto}
.planview .imgbox.big img{width:240%}
.notes{display:flex;flex-direction:column;gap:10px}
.notes p{padding:12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);font-size:.93rem}

/* Outils */
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.tool .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--card));color:var(--c);flex:none}
.tool .ic svg{width:26px;height:26px}
.tool b{display:block;font:600 1.1rem var(--f-display)}
.tool span.s{font-size:.88rem;color:var(--muted);font-weight:600}
.tcard{display:flex;gap:14px}
.tcard .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--club);color:#fff;display:grid;place-items:center;font:700 1.05rem var(--f-display)}
.tcard h3{font-size:1.1rem}
.tcard .u{display:inline-block;margin:4px 0 6px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--club-ink);font:800 .75rem var(--f-body)}
.pitchcard{background:var(--pitch);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.pitchcard svg{display:block;width:100%;height:auto;border-radius:12px}
.lundi{display:flex;flex-direction:column;gap:10px}
.lundi .q{font:600 1.05rem var(--f-display);margin-bottom:8px}
.theme-toggle{margin:26px auto 0;display:flex}
.fade{animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.btn:active{transform:none}}

/* ===== Version 2 : blocs, tests, joueurs, remarques ===== */
:root{--c-passe:#0891b2}
:root[data-theme="dark"]{--c-passe:#4cd3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-passe:#4cd3ee}}
.cat-passe{--c:var(--c-passe)}
.bloc{scroll-margin-top:80px}
.ta,.inp{width:100%;border:0;border-radius:14px;background:var(--soft);color:inherit;font:600 1rem/1.4 var(--f-body);padding:12px 14px;outline:none;box-shadow:inset 0 0 0 1.5px transparent;resize:none;display:block}
.ta{min-height:96px}
.ta:focus,.inp:focus{box-shadow:inset 0 0 0 2px var(--club)}
.ta::placeholder,.inp::placeholder,.pname::placeholder{color:var(--muted);font-weight:600;opacity:.8}
.saved{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:6px}
.remark{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.remark h2{font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.remark p.hint{font-size:.88rem;color:var(--muted);font-weight:600;margin-bottom:10px}

/* Cases à cocher */
.cb{width:34px;height:34px;border-radius:9px;box-shadow:inset 0 0 0 2.5px var(--line);background:var(--card);display:inline-grid;place-items:center;color:transparent;flex:none}
.cb svg{width:18px;height:18px}
.cb[aria-pressed="true"]{background:var(--c-match);color:#fff;box-shadow:none}
.cbrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:700;margin-bottom:8px}
.cbrow[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through}
.cbrow .cb{pointer-events:none}

/* Blocs */
.bcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.bcard .bn{flex:none;width:58px;height:58px;border-radius:18px;background:var(--club);color:#fff;display:grid;place-items:center;font:700 2rem/1 var(--f-display)}
.bcard .mid{flex:1;min-width:0}
.bcard .mid b{display:block;font:600 1.12rem/1.2 var(--f-display)}
.bcard .mid .d{display:block;font-size:.84rem;font-weight:700;color:var(--muted);margin:3px 0 7px}
.bcard .chev{color:var(--muted);flex:none}
.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.bl li{position:relative;padding-left:20px;font-size:.95rem}
.bl li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--club)}
.ctx{display:flex;flex-direction:column;gap:8px;font-size:.93rem}
.ctx b{font-weight:800}
.wk{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px}
.wk header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wk header b{font:600 1.02rem var(--f-display)}
.wk header small{font-weight:700;color:var(--muted);font-size:.8rem}
.wk .th{margin:0 0 8px}
.wk dl{margin:0;display:grid;grid-template-columns:74px 1fr;gap:6px 10px;font-size:.9rem}
.wk dt{font:800 .7rem/1.5 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.wk dd{margin:0}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.lvl{grid-template-columns:1fr}}
.lvl div{background:var(--soft);border-radius:16px;padding:11px 13px;font-size:.9rem}
.lvl b{display:block;font:600 1rem var(--f-display);margin-bottom:2px;color:var(--club-ink)}

/* Tests */
.tschema{border-radius:14px;overflow:hidden;background:var(--pitch);margin:8px 0 10px;max-width:420px}
.tschema img{display:block;width:100%;height:auto}
.tcard2{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px 16px}
.tcard2 .hd{display:flex;gap:12px;align-items:center}
.tcard2 .hd .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--club);color:#fff;display:grid;place-items:center;font:700 1.05rem var(--f-display)}
.tcard2 h3{font-size:1.1rem}
.tcard2 .u{display:inline-block;margin-top:2px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--club-ink);font:800 .75rem var(--f-body)}
.tcard2 p{font-size:.93rem}
.tcard2 .cbrow{box-shadow:inset 0 0 0 1.5px var(--line);margin:12px 0 0}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c-match);border-radius:99px}

/* Fiche joueur */
.pcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pcard.ok{box-shadow:inset 0 0 0 2.5px var(--c-match),var(--shadow)}
.phead{display:flex;align-items:center;gap:12px}
.pname{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:none;color:inherit;font:600 1.15rem var(--f-display);padding:6px 2px;outline:none;border-radius:0}
.pname:focus{border-color:var(--club)}
.pfields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:.8rem;min-width:0}
.fld small{display:block;font-weight:600;color:var(--muted);font-size:.7rem;line-height:1.2}
.fld input{width:100%;min-width:0;height:44px;border-radius:12px;border:0;background:var(--soft);color:inherit;font:700 1.1rem var(--f-body);padding:0 12px;outline:none;box-shadow:inset 0 0 0 1.5px transparent}
.fld input:focus{box-shadow:inset 0 0 0 2px var(--club)}
.pj .fld input{padding:0 6px;text-align:center}
.pj .best input{background:color-mix(in srgb,var(--club) 16%,var(--card))}
.addp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:18px;font:800 1rem var(--f-body);color:var(--club-ink);box-shadow:inset 0 0 0 2px var(--club);background:var(--soft)}
.addp svg{width:20px;height:20px}

/* Grille d'évolution */
.gwrap{overflow-x:auto;margin:0 -16px;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.gt{border-collapse:separate;border-spacing:0;font-size:.8rem;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.gt th{background:var(--club);color:#fff;font:800 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;text-align:center;white-space:nowrap}
.gt thead tr:nth-child(2) th{background:var(--club-dark)}
.gt th small{display:block;font-weight:600;opacity:.8;text-transform:none;letter-spacing:0;font-size:.72rem}
.gt td{border-bottom:1px solid var(--line);padding:0;background:var(--card)}
.gt tbody tr:nth-child(even) td{background:var(--soft)}
.gt td.sep,.gt th.sep{border-left:2px solid var(--line)}
.gt td input{width:56px;height:44px;border:0;background:transparent;color:inherit;text-align:center;font:700 .95rem var(--f-body);outline:none;border-radius:0}
.gt td input:focus{background:color-mix(in srgb,var(--club) 16%,var(--card))}
.gt td.nm,.gt th.nm{position:sticky;left:0;z-index:2}
.gt th.nm{z-index:3}
.gt td.nm input{width:108px;text-align:left;padding:0 8px;font-weight:800;font-family:var(--f-body)}
.gt td.cm input{width:190px;text-align:left;padding:0 8px;font-weight:600}
.legend-note{font-size:.85rem;color:var(--muted);font-weight:600}

/* Compte-rendu */
.crf{display:flex;flex-direction:column;gap:14px}
.crf .card h2{font:800 .74rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--club-ink);margin-bottom:8px}
.ptable{width:100%;border-collapse:collapse;font-size:.9rem}
.ptable th{background:var(--club);color:#fff;font:800 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:8px;text-align:left}
.ptable th:first-child{border-radius:10px 0 0 0}.ptable th:last-child{border-radius:0 10px 0 0}
.ptable td{padding:9px 8px;border-bottom:1px solid var(--line)}
.ptable td:first-child{font-weight:700}
.ptable .up{color:var(--c-match);font-weight:800}
.ptable .down{color:var(--c-duel);font-weight:800}
.n5{display:flex;flex-direction:column;gap:12px}
.n5>div{display:flex;align-items:center;justify-content:space-between;gap:10px}
.n5 b{font-weight:800;font-size:.95rem}
.dots{display:flex;gap:5px}
.dot{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);font:700 .95rem var(--f-display);background:var(--card);display:grid;place-items:center}
.dot[aria-pressed="true"]{background:var(--club);color:#fff;box-shadow:none}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:8px}
.prow b{flex:1;font:600 1.08rem var(--f-display)}
.prow .tag{background:var(--c-match)}
.prow svg{width:16px;height:16px;color:var(--muted)}
.copybox{margin-top:10px}
.copybox textarea{min-height:200px;font-size:.88rem}
.btn.sec2{background:var(--soft);color:var(--club-ink);box-shadow:inset 0 0 0 2px var(--club)}
.btn.danger{background:var(--c-duel);box-shadow:0 4px 0 color-mix(in srgb,var(--c-duel) 60%,#000)}
.mini{padding:8px 14px;font-size:.85rem;box-shadow:none}
.plist{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.plist .inp{flex:1;min-width:0;height:46px;padding:0 14px;font-weight:700}
.plist .iconbtn{color:var(--c-duel)}
.plist .btn{padding:10px 14px}

.btn svg{width:20px;height:20px;flex:none}

/* ===== Touches d'or (comme le logo) ===== */
:root{--gold:#f5b800;--gold-ink:#120d00;--gold-line:#d9ac3a;--gold-soft:rgba(240,180,0,.5)}
:root[data-theme="dark"]{--gold-line:#e0b445}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold-line:#e0b445}}
.top{border-bottom:3px solid var(--gold)}
.top .logo{box-shadow:0 0 0 2px var(--gold)}
/* Tests de départ : bandeau or */
/* Bouton Ouvrir la séance : or */
/* Cadres décoratifs fins : filet or intérieur */
.hero::after,.sbanner::after{content:"";position:absolute;inset:7px;border-radius:20px;border:1.5px solid var(--gold-soft);pointer-events:none;z-index:0}
.hero .eyebrow,.sbanner .eyebrow{color:#f5d77a}
.bcard .bn{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold-line)}
.srow.next{box-shadow:inset 0 0 0 2.5px var(--club),0 0 0 1.5px var(--gold-line),var(--shadow)}
.dateblock{box-shadow:inset 0 -3px 0 var(--gold-line)}
.tabs-in{box-shadow:0 10px 30px -10px rgba(10,20,50,.35),0 0 0 1px var(--line),inset 0 2px 0 var(--gold-line)}
.ask{box-shadow:inset 0 0 0 1.5px var(--gold-soft)}
.bloc>header{border-left:4px solid var(--gold-line);padding-left:10px}

/* Lisibilité sur l'or, clair et sombre : texte noir fixe + contour */
.promo,.promo b,.promo span,.promo svg{color:var(--gold-ink)}
.promo span.s{font-weight:700}
.promo{background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-ink),0 0 0 2px #fff3c4,0 8px 16px -10px rgba(0,0,0,.6)}
.hero .btn,.sbanner .btn{background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 0 0 2px var(--gold-ink),0 4px 0 #8a6500}

/* ===== Présence et fiche joueur ===== */
.tab .emo{display:block;font-size:19px;line-height:23px;height:23px}
.av{width:44px;height:44px;border-radius:50%;background:var(--club);color:#fff;display:grid;place-items:center;font:700 1.25rem var(--f-display);box-shadow:0 0 0 2px var(--gold-line);flex:none}
.av.big{width:58px;height:58px;font-size:1.7rem}
.pc{display:block;font:800 .75rem var(--f-body);color:var(--c-match);margin-top:2px;text-align:right}

/* Présence à une séance */
.att{padding:14px}
.atthd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:12px}
.atthd b{font:600 1.1rem var(--f-display)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.agrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ab{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--soft);box-shadow:inset 0 0 0 2px transparent;text-align:left;min-width:0;transition:background .12s}
.ab .mk{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:#fff}
.ab .mk svg{width:19px;height:19px}
.ab .nm{font:600 1.05rem/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ab.p{background:color-mix(in srgb,var(--c-match) 18%,var(--card));box-shadow:inset 0 0 0 2px var(--c-match)}
.ab.p .mk{background:var(--c-match);box-shadow:none}
.ab.a{background:color-mix(in srgb,var(--c-duel) 14%,var(--card));box-shadow:inset 0 0 0 2px var(--c-duel)}
.ab.a .mk{background:var(--c-duel);box-shadow:none}
.ab.a .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}

/* Liste et fiche des joueurs */
.pl{gap:12px}
.pl .mid{flex:1;min-width:0;display:block}
.pl .mid b{display:block;font:600 1.1rem var(--f-display);flex:none}
.pl .mid small{display:block;font-weight:700;font-size:.8rem;color:var(--muted);margin-top:1px}
.pfiche .who{display:flex;align-items:center;gap:14px}
.pfiche .pname{font-size:1.45rem;width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.kpis b{display:block;font:700 1.5rem/1.1 var(--f-display);color:var(--club-ink)}
.kpis span{display:block;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.dgrid{display:flex;flex-wrap:wrap;gap:6px}
.dchip{min-width:64px;padding:7px 8px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 2px transparent;text-align:center;font:800 .8rem/1.15 var(--f-body);color:var(--muted)}
.dchip small{display:block;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.dchip.future{opacity:.6}
.dchip.p{background:color-mix(in srgb,var(--c-match) 20%,var(--card));box-shadow:inset 0 0 0 2px var(--c-match);color:var(--ink);opacity:1}
.dchip.a{background:color-mix(in srgb,var(--c-duel) 16%,var(--card));box-shadow:inset 0 0 0 2px var(--c-duel);color:var(--ink);text-decoration:line-through;opacity:1}
.ptable.pt4 th,.ptable.pt4 td{padding:9px 5px;text-align:center;font-size:.86rem}
.ptable.pt4 th:first-child,.ptable.pt4 td:first-child{text-align:left}
.ptable.pt4 th:last-child{width:26px}
.tab[aria-current="page"] .emo{filter:grayscale(1) brightness(0) invert(1)}
.ptable.pt4 th{white-space:nowrap;padding:8px 3px;font-size:.72rem}
.pfiche~.sec .seg.wrap,.seg.wrap{flex-wrap:wrap;overflow:visible}
.srow.plat{box-shadow:inset 4px 0 0 var(--gold-line),var(--shadow)}
.srow.plat .dur .pc{margin:0}

/* ===== Matchs du plateau ===== */
.mcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mhd b{font:600 1.15rem var(--f-display);min-width:0}
.mcard .inp{width:100%}
.scoreb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:12px 0}
.scoreb .side{background:var(--soft);border-radius:16px;padding:8px 4px 10px;text-align:center}
.scoreb .side small{display:block;font:800 .72rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.scoreb .dash{font:600 1.6rem var(--f-display);color:var(--muted)}
.stp{display:inline-flex;align-items:center;gap:3px;flex:none}
.stp .e{font-size:1rem;line-height:1;margin-right:1px}
.stp button{width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font:800 1.2rem/1 var(--f-body);display:grid;place-items:center;color:var(--ink)}
.stp button.inc{background:var(--club);box-shadow:none;color:#fff}
.stp i{min-width:22px;text-align:center;font:700 1.15rem var(--f-display);font-style:normal;color:var(--ink)}
.stp.big{gap:6px}
.stp.big button{width:38px;height:38px;font-size:1.4rem}
.stp.big i{font-size:2rem;min-width:34px}
.mleg{display:flex;justify-content:flex-end;gap:14px;font:800 .72rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.mp{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.mp .nm{flex:1;min-width:0;font:600 1.02rem var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp .stp i{min-width:18px}
.btn.fin{width:100%;margin-top:14px;background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 0 0 2px var(--gold-ink),0 4px 0 var(--gold-line)}
.btn.fin svg{width:20px;height:20px}
.donebar{background:color-mix(in srgb,var(--c-match) 16%,var(--card))}
.donebar svg{width:18px;height:18px;vertical-align:-3px;color:var(--c-match)}
.mcard.rep p{margin-top:8px}
.bigscore{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 6px}
.bigscore b{font:700 2.4rem/1 var(--f-display);color:var(--club-ink)}
.bigscore i{font:600 1.6rem var(--f-display);font-style:normal;color:var(--muted)}
.bigscore span{font:800 .72rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tag.v,.tag.n,.tag.d{background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--ink);box-shadow:inset 0 0 0 2px var(--c)}
.tag.v{--c:var(--c-match)}.tag.d{--c:var(--c-duel)}.tag.n{--c:var(--muted)}
.kpis.k2{grid-template-columns:repeat(2,1fr);margin-top:8px}
.kpis.k4{grid-template-columns:repeat(4,1fr);margin-top:0}
.kpis.k4 b{font-size:1.25rem}

/* ===== Connexion et synchro ===== */
#gate{position:fixed;inset:0;z-index:1000;overflow:auto;background:var(--bg);color:var(--ink);display:flex;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gbox{margin:auto;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:center}
.gbox .logo{width:72px;height:72px;border-radius:50%;margin:0 auto 2px;box-shadow:0 0 0 2px var(--club);background:#fff;display:block}
.gbox h1{font-size:1.7rem;margin:0 0 8px}
.gbox form{display:flex;flex-direction:column;gap:6px;text-align:left}
.gbox label{font:800 .8rem var(--f-body);color:var(--muted);margin-top:6px}
.gbtn{width:100%;margin-top:8px}
.gbtn:disabled{opacity:.6}
.btn.alt{background:transparent;color:var(--club-ink);box-shadow:inset 0 0 0 2px var(--club)}
.glink{align-self:center;padding:10px;font:800 .92rem var(--f-body);color:var(--club-ink);text-decoration:underline}
.gmsg{min-height:1.3em;margin-top:6px;font-size:.92rem;font-weight:700;color:var(--c-duel)}
.gmsg.ok{color:color-mix(in srgb,var(--c-match) 70%,var(--ink))}
.gtxt{font-weight:600;color:var(--muted)}
.syncpill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font:800 .68rem/1 var(--f-body);white-space:nowrap}
.syncpill i{width:8px;height:8px;border-radius:50%;background:#5be28a}
.syncpill.s-offline i{background:#ffb347}
.syncpill.s-pending i{background:#fff}
.syncpill.s-off i,.syncpill.s-err i{background:#ff7a72}

<script>
const D={"exercices":[{"num":1,"titre":"Circuit de motricité","objectif":"Coordination, équilibre et appuis, sans ballon.","consigne":"Je saute, je cours, je tiens sur un pied, sans toucher les plots.","installation":"En dehors des terrains, dans un coin à côté du quart de terrain. 2 circuits côte à côte, un par groupe, chacun d'environ 12 × 8 m (cerceaux et lattes espacés de 1 m, plots en zigzag espacés de 2 m). 5 stations en boucle : cerceaux, lattes, plots en zigzag, slalom, équilibre.","deroulement":["Un enfant part toutes les 3 à 4 secondes.","Cerceaux pieds joints, puis lattes à cloche-pied (pied droit au 1er tour, pied gauche au 2e).","Pas chassés entre les plots en zigzag, puis slalom en courant.","Équilibre sur un pied pendant 3 secondes, puis retour au départ.","2 à 3 tours. Une seule chose change chaque semaine : sauts en arrière, pied changé, plot de couleur à toucher."],"g1":"Plus vite, variantes plus exigeantes (sauts en arrière, pas chassés croisés).","g2":"Rythme libre, une station après l'autre.","erreurs":["Les sauts sans rythme dans les cerceaux. « Pieds joints, on rebondit comme un ressort. »","On double les copains. Départ toutes les 3 secondes, chacun garde sa place."],"materiel":"Par circuit : 4 cerceaux, 4 lattes (ou plots couchés), 6 plots, 1 coupelle de départ.","img":"img/ex1.jpg","categorie":"echauffement","type_label":"Routine","quand":"5 min · AU DÉBUT DE CHAQUE SÉANCE","duree":"5 min","principal":false,"nouveau_bloc":2},{"num":2,"titre":"Jonglage","objectif":"Sentir le ballon, des deux pieds.","consigne":"Je bats mon record.","installation":"Chaque groupe dans une moitié de terrain, chacun son espace. Chaque éducateur suit son groupe.","deroulement":["Palier 1 : lâcher, un rebond, une touche du pied, rattraper.","Palier 2 : pied, rebond, pied, rebond, sans rattraper.","Palier 3 : jongles sans rebond, du bon pied. Palier 4 : en alternant droit et gauche. Palier 5 : pied et cuisse.","2 minutes d'essai, puis 3 essais pour battre son record. L'éducateur note le record.","Palier réussi 5 fois de suite : on passe au palier suivant."],"g1":"Commence au palier 3, un essai du pied faible.","g2":"Commence au palier 1 ou 2.","erreurs":["Le ballon monte trop haut. « Le ballon ne monte pas plus haut que ton genou. »","Frappe du bout du pied. « Le lacet, la cheville bloquée. »"],"materiel":"1 ballon par enfant, la fiche des records et un crayon.","img":"img/ex2.jpg","categorie":"echauffement","type_label":"Routine","quand":"5 min · CHAQUE LUNDI","duree":"5 min","principal":false,"nouveau_bloc":2},{"num":3,"titre":"Feu rouge / feu vert","objectif":"Démarrer, freiner et changer de direction, ballon au pied.","consigne":"Je regarde la couleur, pas mon ballon.","installation":"Tout le monde dans le terrain 1 (24 × 34 m), chacun avec son ballon. L'éducateur au bord, entre les deux terrains, avec les 3 couleurs.","deroulement":["Tout le monde conduit son ballon dans le carré.","Vert : je conduis. Rouge : semelle sur le ballon. Jaune : demi-tour.","Séries de 1 minute, 20 secondes de pause.","Les signaux arrivent de plus en plus vite au fil des séries."],"g1":"Couleur montrée sans parler, conduite du pied faible.","g2":"Couleur dite à voix haute, vert et rouge seulement au début.","erreurs":["Tête baissée, il rate la couleur. Montrer la couleur sans parler, féliciter le premier qui réagit.","Au rouge, le ballon part loin. « Qui garde son ballon collé au pied ? »"],"materiel":"1 ballon par enfant, 3 couleurs (vert, jaune, rouge). Le terrain est déjà installé.","img":"img/ex3.jpg","variantes":[{"bloc":3,"levier":"Levier 4 · Consigne la phrase dite aux enfants","avant":"Vert : je conduis. Rouge : semelle. Jaune : demi-tour. Consigne : « Je regarde la couleur, pas mon ballon. »","regle":"Rien ne change dans le jeu : mêmes couleurs, mêmes séries. Seule la phrase change.","dit":"Même jeu : cette fois, je regarde aussi où sont mes copains.","consigne":"Je regarde la couleur et je cherche un copain libre.","g1":"Comme d'habitude.","g2":"Comme d'habitude.","img":"img/var3_3.jpg"},{"bloc":4,"levier":"Levier 4 · Consigne la phrase dite aux enfants","avant":"Consigne du bloc 3 : « Je regarde la couleur et je cherche un copain libre. »","regle":"Rien ne change dans le jeu : mêmes couleurs, mêmes séries. Seule la phrase change.","dit":"Même jeu : je cherche l'espace libre, comme sur un vrai terrain.","consigne":"Je regarde la couleur et je cherche l'espace libre.","g1":"Comme d'habitude.","g2":"Comme d'habitude.","img":"img/var4_3.jpg"}],"categorie":"echauffement","type_label":"Échauffement","quand":"7 min · MERCREDI 18 NOVEMBRE, PUIS EN PLAN B","duree":"7 min","principal":true,"nouveau_bloc":2},{"num":4,"titre":"Départs sur signal","objectif":"Réagir et démarrer vite.","consigne":"Au top, je me lève et je fonce.","installation":"Dans la moitié du haut du terrain 1 (24 × 17 m) : 4 couloirs côte à côte de 5 m de large (20 m en tout), de 8 m de long (5 m pour le Groupe 2). 5 plots au départ, 5 plots à l'arrivée. Tous les enfants au départ en même temps, dans la même position : debout, assis, de dos ou accroupi.","deroulement":["Tous les enfants partent en même temps, dans la même position : d'abord debout, puis assis, puis de dos, puis accroupi.","Au signal, tout le monde sprinte en même temps jusqu'à l'arrivée.","Retour en marchant par l'extérieur.","On change de position à chaque départ : debout, assis, de dos, accroupi. 4 à 6 départs en tout."],"g1":"Départ de dos ou accroupi, 8 m, signal visuel.","g2":"Départ debout ou assis, 5 m, signal à la voix.","erreurs":["Il part avant le signal. Varier le temps d'attente.","Il ralentit avant la ligne. « On court jusqu'au plot d'après. »"],"materiel":"10 plots pour 4 couloirs de 5 à 8 m.","img":"img/ex4.jpg","variantes":[{"bloc":3,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Chaque enfant part seul dans son couloir, tous en même temps.","regle":"On part à deux : 2 enfants par couloir. Au signal, le 1er part ; le 2e part 1 seconde après et essaie de le rattraper. On change de rôle au départ suivant.","dit":"On part à deux : je pars au top, mon copain part une seconde après.","consigne":"Au top, je fonce ; mon copain me suit.","g1":"Départ de dos ou accroupi, 8 m, signal visuel.","g2":"Départ debout ou assis, 5 m, le 2e part 2 secondes après.","img":"img/var3_4.jpg"}],"categorie":"echauffement","type_label":"Échauffement","quand":"7 min · MERCREDI 2 DÉCEMBRE, ET EN PLAN B","duree":"7 min","principal":true,"nouveau_bloc":2},{"num":5,"titre":"Contrôle-passe-tir","objectif":"Contrôler vers le but et frapper juste.","consigne":"Mon contrôle regarde le but.","installation":"Dans la moitié de terrain côté but. A et B à 8 m l'un de l'autre, à 8 m de la ligne de but. B est à 1,5 m du centre du but : il doit se tourner pour frapper. Derrière A, 3 plots de couleur à 3 m l'un de l'autre, à 3 m de A, où attendent les joueurs.","deroulement":["A passe à B.","B contrôle vers le but et frappe.","A prend la place de B ; B va attendre sur un plot de couleur au départ.","En même temps, le gardien travaille sa relance : il relance vers la couleur annoncée par l'éducateur (Relance du gardien).","Après 5 minutes, le but change de côté : on contrôle de l'autre pied."],"g1":"Contrôle orienté et frappe en 2 touches, but du pied faible.","g2":"Contrôle, arrêt, frappe ; but plus large.","erreurs":["B contrôle dos au but, le ballon s'arrête. « Ton premier contrôle regarde le but. »","Passe trop forte ou du pointu. « Intérieur du pied, dans les pieds du copain. »"],"materiel":"Par atelier : 2 plots (A et B), 3 plots de couleur au départ A, 1 but avec le gardien du groupe, 3 ballons.","img":"img/ex5.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"A passe à B, B contrôle vers le but et frappe.","regle":"La une-deux : A passe à B, B remet en une touche à A qui a avancé, A contrôle et frappe. Le tir compte seulement s'il y a eu une-deux.","dit":"Après ma passe, je cours : mon copain me la rend et je tire.","consigne":"Je passe, je cours, mon copain me la rend.","g1":"La remise de B en une touche, contrôle orienté puis frappe en 2 touches, but du pied faible.","g2":"B remet en 2 touches, A contrôle, arrête, puis frappe ; but plus large.","img":"img/var3_5.jpg"},{"bloc":4,"levier":"Levier 3 · Espace carré, zones, terrain","avant":"Bloc 3 : une-deux, A et B à 8 m de la ligne de but.","regle":"On recule : A et B partent à 15 m du but, la remise se fait sur 6 m et le tir part de 10 m, avec le gardien du foot à 5 (but de 4 m).","dit":"Même une-deux, mais on part de plus loin : 15 mètres du but.","consigne":"Je regarde le but avant de recevoir la remise.","g1":"Remise en une touche, tir en 2 touches, but du pied faible.","g2":"Remise en 2 touches, tir libre, but plus large.","img":"img/var4_5.jpg"}],"categorie":"technique","type_label":"Technique","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":2},{"num":6,"titre":"Triangle de passes","objectif":"Orienter son contrôle vers l'espace libre.","consigne":"Mon premier contact m'emmène vers le copain suivant.","installation":"Dans une moitié de terrain : 2 triangles de 5 m de côté, à 6 m l'un de l'autre, 1 joueur par plot.","deroulement":["A passe à B.","B contrôle vers C sans arrêter le ballon.","B passe à C, et on continue.","On suit sa passe : on court au plot où on a passé.","Au signal, on change de sens."],"g1":"Contrôle orienté en 1 touche, du pied le plus loin.","g2":"Contrôle, arrêt, puis passe.","erreurs":["Contrôle sous la semelle, le ballon s'arrête. Un plot derrière le receveur : « Ton contrôle sort du plot. »","Corps fermé, dos au copain suivant. « Ouvre-toi vers celui à qui tu vas passer. »"],"materiel":"3 plots par triangle, 1 ballon pour 3.","img":"img/ex6.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"A passe à B, B contrôle vers C, et on suit sa passe.","regle":"Une-deux dans le triangle : A passe à B, B remet à A en une touche, puis A passe à C et suit sa passe. Seuls les tours avec une-deux comptent (on compte à voix haute).","dit":"Avant de passer au suivant, on fait une-deux avec le copain.","consigne":"Je passe, je cours, je la reçois.","g1":"Une-deux en une touche, contrôle orienté vers C.","g2":"Une-deux en 2 touches, contrôle libre.","img":"img/var3_6.jpg"},{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : triangle de 5 m, une-deux puis passe au 3e.","regle":"On passe à 4 : un carré de 5 m de côté, 1 joueur par plot, 1 ballon pour 4. Une-deux avec le voisin, puis passe au plot suivant.","dit":"Un joueur de plus : on joue dans un carré à 4.","consigne":"Mon contrôle m'emmène vers le copain suivant, on joue à quatre.","g1":"Une-deux en une touche, contrôle orienté.","g2":"Une-deux en 2 touches.","img":"img/var4_6.jpg"}],"categorie":"technique","type_label":"Technique","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":2},{"num":7,"titre":"Conduite et passes pied faible","objectif":"Utiliser les deux pieds.","consigne":"J'écoute ma couleur et j'ose mon pied faible.","installation":"Le mercredi, un terrain entier ; le lundi, une moitié de terrain. 6 portes de 2 m dispersées dans un terrain de 24 × 34 m. Moitié du groupe en rouge, moitié en jaune (un nombre pair, pour faire des paires). Nombre impair : la dernière paire passe à 3.","deroulement":["Chacun conduit son ballon et traverse le plus de portes possible.","« Stop ! » : tout le monde met la semelle sur son ballon (stop ball).","L'éducateur annonce une couleur, par exemple « Rouge ! » : les rouges laissent leur ballon sur place.","Chaque rouge va vers le jaune libre le plus proche. Avec le ballon du jaune, ils font 5 passes à travers une porte, du pied faible.","Après les 5 passes, le rouge retourne à son ballon et tout le monde repart en conduite. L'éducateur change de couleur pendant tout l'exercice."],"g1":"Passes du pied faible en 2 touches, conduite du pied faible aussi.","g2":"Passes du pied faible, contrôle libre, conduite du pied au choix.","erreurs":["La passe part du pied fort par réflexe. « Qui a déjà réussi 3 passes du pied faible ? »","Deux rouges vont vers le même jaune. « Cherche le copain libre le plus proche. »"],"materiel":"1 ballon par enfant, chasubles de 2 couleurs, 12 plots (6 portes de 2 m).","img":"img/ex7.jpg","variantes":[{"bloc":3,"levier":"Levier 4 · Consigne la phrase dite aux enfants","avant":"Passes du pied faible à travers une porte. Consigne : « J'écoute ma couleur et j'ose mon pied faible. »","regle":"Rien ne change dans le jeu : mêmes couleurs, mêmes 5 passes du pied faible. Seule la phrase change.","dit":"Même jeu : après ma passe, je bouge.","consigne":"Après ma passe du pied faible, je bouge.","g1":"Comme d'habitude.","g2":"Comme d'habitude.","img":"img/var3_7.jpg"},{"bloc":4,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Bloc 3 : 5 passes du pied faible à travers une porte.","regle":"La passe à travers la porte compte seulement si le receveur contrôle en une touche vers l'espace libre.","dit":"La passe compte si mon copain contrôle vers l'espace.","consigne":"Je passe du pied faible, mon copain contrôle vers l'espace.","g1":"Contrôle en une touche, passe du pied faible en 2 touches.","g2":"Contrôle en 2 touches, passe du pied faible.","img":"img/var4_7.jpg"}],"categorie":"technique","type_label":"Technique","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":2},{"num":8,"titre":"Les 4 surfaces","objectif":"Toucher le ballon avec toutes les parties du pied.","consigne":"Intérieur, extérieur, semelle : tout le pied travaille.","installation":"Dans une moitié de terrain : 4 couloirs côte à côte de 6 m de long, à 3 m l'un de l'autre (9 m en tout). Coupelle au départ, plot à 6 m. 2 enfants par couloir, tous les deux à la coupelle. Le copain part quand l'autre a fini.","deroulement":["Aller pied droit, tour du plot, retour pied gauche.","Aller extérieur du pied, retour semelle (en marche arrière, semelle sur le ballon).","Toque-toque : ballon entre les pieds, intérieur droite-gauche jusqu'au plot, puis semelles alternées en sautillant. Au sifflet : conduite rapide, tour du plot, passe au copain qui contrôle.","Environ 1 minute par surface, 3 passages chacun. On récupère pendant que le copain travaille."],"g1":"Tout plus vite, contrôle orienté en 1 touche, passe du pied faible.","g2":"Pause possible entre deux surfaces, contrôle libre.","erreurs":["Il regarde ses pieds en conduite. « Lève la tête entre deux touches. »","Le ballon part trop loin. « Petites touches, le ballon reste près. »"],"materiel":"Par couloir : 1 coupelle, 1 plot à 6 m, 1 ballon pour 2.","img":"img/ex8.jpg","categorie":"technique","type_label":"Technique","quand":"9 à 12 min · MERCREDIS 4 ET 18 NOVEMBRE, 2 DÉCEMBRE","duree":"9–12 min","principal":false,"nouveau_bloc":2},{"num":9,"titre":"Jeu de scan à 3 lignes","objectif":"Regarder derrière soi avant d'agir.","consigne":"Je regarde dans mon dos avant que le ballon parte.","installation":"Les 18 m devant le but du terrain, sur toute la largeur (24 m), coupés en 3 lignes de 6 m (coupelles sur les côtés). Ligne 1 : le passeur. Ligne 2 : le milieu. Ligne 3 : le receveur. Le but et le gardien derrière la ligne 3. Le ballon vient de l'éducateur, ou chaque enfant a son ballon à la source.","deroulement":["Le passeur (ligne 1) se déplace seulement de gauche à droite et passe au receveur (ligne 3).","Le milieu (ligne 2) regarde dans son dos où va le receveur et essaie de couper la passe.","Passe réussie : le receveur marque face au gardien, le milieu essaie de l'en empêcher.","Passe coupée : le milieu se retourne et fait un 1 contre 1 vers le but, le receveur défend.","Rotation : passeur → milieu → receveur → source."],"g1":"Le receveur n'a que 3 secondes pour se libérer.","g2":"Le milieu coupe la passe en restant sur sa ligne.","erreurs":["Le milieu ne regarde que le ballon. « Que fait le copain derrière toi ? »","Passe en l'air ou trop forte. « Passe au sol, dans la course du receveur. »"],"materiel":"1 but avec un gardien, 6 plots pour marquer les 3 lignes, des ballons à la source.","img":"img/ex9.jpg","variantes":[{"bloc":3,"levier":"Levier 4 · Consigne la phrase dite aux enfants","avant":"Le milieu regarde dans son dos où va le receveur. Consigne : « Je regarde dans mon dos avant que le ballon parte. »","regle":"Rien ne change dans le jeu : mêmes 3 lignes, mêmes rotations. Seule la phrase change (semaine « le regard »).","dit":"Même jeu : le regard sert à choisir la bonne place.","consigne":"Je regarde, puis je choisis la bonne place.","g1":"Comme d'habitude : le receveur n'a que 3 secondes.","g2":"Comme d'habitude.","img":"img/var3_9.jpg"},{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : 1 milieu sur la ligne 2, le receveur a 3 secondes.","regle":"2 milieux sur la ligne 2 au lieu d'un : le receveur doit se libérer de deux joueurs. Passe coupée : le milieu qui a coupé fait un 1 contre 1.","dit":"Il y a deux milieux sur la ligne du milieu.","consigne":"Je regarde les deux milieux : où est la place ?","g1":"Le receveur n'a que 3 secondes pour se libérer.","g2":"Les milieux restent sur leur ligne.","img":"img/var4_9.jpg"}],"categorie":"jeux","type_label":"Jeu","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":2},{"num":10,"titre":"Rondo","objectif":"Garder le ballon à plusieurs.","consigne":"Je me montre pour que mon copain me voie.","installation":"Un carré de 8 × 8 m par groupe, dans une moitié de terrain, un éducateur par carré.","deroulement":["Les attaquants sur les côtés, le défenseur au milieu.","Ils se passent le ballon en respectant le nombre de touches.","Celui qui perd le ballon va au milieu.","On compte les passes à voix haute : record du carré."],"g1":"4 contre 1 en 2 touches, puis 4 contre 2 à partir de la semaine 4.","g2":"5 contre 1 en 3 touches. Enfant en plus : 6 contre 1.","erreurs":["Les attaquants restent cachés derrière le défenseur. « Est-ce que ton copain te voit ? »","Passes trop fortes, le ballon sort. Compter les passes réussies à voix haute."],"materiel":"Par carré : 4 plots, 1 ballon, chasubles pour les défenseurs.","img":"img/ex10.jpg","variantes":[{"bloc":3,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"G1 : 4 contre 1 en 2 touches. G2 : 5 contre 1 en 3 touches.","regle":"Un défenseur de plus au milieu : 2 défenseurs dans le carré de 8 × 8 m. Celui qui perd le ballon prend la place d'un défenseur.","dit":"Un défenseur de plus au milieu : on joue à 4 contre 2.","consigne":"Je me montre au porteur, loin des deux défenseurs.","g1":"4 contre 2 en 2 touches.","g2":"5 contre 2 en 3 touches.","img":"img/var3_10.jpg"},{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : 4 contre 2 (G1), 5 contre 2 (G2).","regle":"Un partenaire de plus : G1 5 contre 2 dans un carré de 8 × 8 m ; G2 6 contre 2 en 3 touches. Le carré ne change pas.","dit":"Un partenaire de plus : on joue à 5 contre 2.","consigne":"On joue à plusieurs : je me montre, je donne.","g1":"5 contre 2 en 2 touches.","g2":"6 contre 2 en 3 touches.","img":"img/var4_10.jpg"}],"categorie":"jeux","type_label":"Jeu","quand":"8 min · CHAQUE LUNDI","duree":"8 min","principal":true,"nouveau_bloc":2},{"num":11,"titre":"Duel 1 contre 1 vers un but","objectif":"Oser attaquer son adversaire.","consigne":"J'attaque mon défenseur, je n'ai pas peur.","installation":"Dans une moitié de terrain : 2 couloirs côte à côte, à 12 m l'un de l'autre. But de 2 plots écartés de 2,5 m, à 10 m du plot de départ. Le défenseur sur la ligne de but, les attaquants en file.","deroulement":["Au signal, l'attaquant part avec le ballon.","Le défenseur sort de sa ligne.","5 secondes pour marquer entre les plots.","Un dribble réussi rapporte 1 point, même sans but.","L'attaquant devient défenseur, le défenseur va au bout de la file."],"g1":"Le défenseur sort tout de suite, but de 2 m.","g2":"Le défenseur part 2 secondes après, 7 secondes pour marquer.","erreurs":["L'attaquant fuit sur le côté. Applaudir chaque tentative de dribble.","Le défenseur plonge. « Reste debout, pousse-le sur le côté. »"],"materiel":"Par couloir : 2 plots de but, 1 plot de départ, 4 à 5 ballons.","img":"img/ex11.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Dribble réussi = 1 point, même sans but. 5 secondes pour marquer.","regle":"Un but marqué après avoir battu le défenseur compte 2 points. Un dribble réussi sans but reste 1 point.","dit":"Un but après un dribble réussi compte double.","consigne":"J'attaque, je dribble, je tire.","g1":"Le défenseur sort tout de suite, but de 2 m.","g2":"Le défenseur part 2 secondes après, 7 secondes pour marquer.","img":"img/var3_11.jpg"},{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : 1 contre 1 vers 2 plots, un but après dribble compte double.","regle":"Un gardien dans le but à la place des 2 plots : l'attaquant tire face à un gardien. Dribble réussi : 1 point ; but après dribble : 2 points.","dit":"Il y a un gardien dans le but.","consigne":"J'attaque, je regarde le gardien, je tire.","g1":"Le défenseur sort tout de suite, 5 secondes pour marquer.","g2":"Le défenseur part 2 secondes après, 7 secondes pour marquer.","img":"img/var4_11.jpg"}],"categorie":"duel","type_label":"Duel","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":2},{"num":12,"titre":"2 contre 1 avec transition","objectif":"Jouer à deux et réagir à la perte du ballon.","consigne":"On marque à deux. Si je perds le ballon, je défends tout de suite.","installation":"Une moitié de terrain de 24 × 17 m : le but du terrain d'un côté, un mini-but de 3 m sur la ligne du milieu, à 17 m du but. 2 attaquants, 1 d  ou plots hauts par équipe, 1 ballon par enfant.","img":"img/ex19.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Chaque enfant tire à tour de rôle, ligne de tir à 6 m du filet.","regle":"Le tir ne compte que si le tireur a reçu une passe d'un copain de sa file (à 4 m). Une quille tombée sans passe est remise debout.","dit":"Je passe à mon copain, il tire : sans passe, la quille ne compte pas.","consigne":"Je passe à mon copain, il vise la quille.","g1":"La passe se fait du pied faible, le tir aussi à la manche 2.","g2":"La passe peut se faire à la main au début.","img":"img/var3_19.jpg"},{"bloc":4,"levier":"Levier 3 · Espace carré, zones, terrain","avant":"Bloc 3 : passe d'un copain, puis tir de la ligne à 6 m.","regle":"La ligne de tir recule : 8 m du filet au lieu de 6 m. Le tir est toujours précédé d'une passe.","dit":"La ligne de tir recule de 6 à 8 mètres.","consigne":"Je vise la quille, même de loin.","g1":"Ligne de tir à 8 m, tir de volée interdit.","g2":"Ligne de tir à 7 m.","img":"img/var4_19.jpg"}],"categorie":"jeux","type_label":"Jeu du mercredi","quand":"8 à 10 min · MERCREDI 25 NOVEMBRE","duree":"8–10 min","principal":false,"nouveau_bloc":2},{"num":20,"titre":"Multi-matchs","objectif":"Déplacement, passe et disponibilité.","consigne":"Je demande le ballon, je fais la passe, puis je me déplace pour être libre.","installation":"Le lundi (8 à 9 enfants), un seul terrain de 30 × 20 m (taille du foot à 3 ou à 4) : 3 + 1 gardien contre 3 + 1 gardien. Nombre impair : un joker.","deroulement":["Matchs de 4 minutes.","Après chaque match, on change les équipes.","Les postes tournent à chaque match.","Version courte à crier du bord du terrain : « Je demande, je passe, je bouge ! »"],"g1":"Un but compte après 3 passes.","g2":"Jeu libre, joker qui attaque avec l'équipe qui a le ballon.","erreurs":["Tout le monde en grappe autour du ballon. « Qui est libre loin du ballon ? »","Personne ne demande le ballon. « Appelle ton copain ! »"],"materiel":"1 terrain de 30 × 20 m, 2 buts, chasubles.","img":"img/ex20.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"G1 : un but compte après 3 passes. G2 : jeu libre.","regle":"Une règle par semaine, une seule à la fois (voir le tableau ci-dessous). Le terrain, le nombre de joueurs et les postes ne changent pas.","dit":"Cette semaine, une seule nouvelle règle : voir le tableau.","consigne":"Je demande le ballon, je fais la passe, je bouge.","g1":"Règle de la semaine appliquée à tous les buts.","g2":"Règle de la semaine, jeu libre pour le reste.","img":null},{"bloc":4,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Bloc 3 : une règle par semaine (une-deux, passeur qui bouge, 3 touches, un presse l'autre couvre).","regle":"Une règle par semaine, une seule à la fois (voir le tableau ci-dessous). Le terrain, le nombre de joueurs et les postes ne changent pas.","dit":"Cette semaine, une seule nouvelle règle : voir le tableau.","consigne":"Je demande le ballon, je fais la passe, je bouge.","g1":"Règle de la semaine appliquée à tous les buts.","g2":"Règle de la semaine, jeu libre pour le reste.","img":null}],"regles_semaine":{"3":{"note":"Une seule règle nouvelle par semaine. L'éducateur la dit en une phrase, au début du match. Mercredi matchs : un but d'un très bon compte seulement après une passe à un partenaire ; le 1er but d'un enfant qui n'a pas encore marqué compte double.","lignes":[["Semaine 1","La une-deux","Un but après une-deux compte double."],["Semaine 2","Après ma passe, je bouge","Le but compte seulement si le passeur a changé de place après sa passe."],["Semaine 3","Je me montre au porteur","Le but compte seulement si les 3 joueurs de champ ont touché le ballon."],["Semaine 4","On défend à deux","Après une perte, le plus proche presse, un autre couvre : un ballon repris = 1 point."],["Semaine 5","Le regard (révision du bloc 2)","Révision : un but compte après 3 passes (règle du bloc 2)."]]},"4":{"note":"Une seule règle nouvelle par semaine. L'éducateur la dit en une phrase, au début du match. Semaine 5 : pas de lundi (lundi 29 mars férié) ; le mercredi 31 mars on rejoue le match à 3 zones.","lignes":[["Semaine 1","Le gardien relance court","Chaque remise en jeu du gardien est courte, à la main ou au pied."],["Semaine 2","Ballon perdu : tout le monde défend","Un ballon repris à l'adversaire dans sa moitié de terrain = 1 point."],["Semaine 3","Ballon gagné : on attaque vite","Un but marqué dans les 6 secondes après avoir gagné le ballon compte double."],["Semaine 4","Je reste large","Un but après un centre (passe venue du côté) compte double."],["Semaine 6","Séance normale et détente","Les enfants choisissent une des règles des semaines 1 à 4 ; un but compte après 3 passes."]]}},"categorie":"match","type_label":"Match","quand":"20 à 23 min · CHAQUE LUNDI","duree":"20–23 min","principal":false,"nouveau_bloc":2},{"num":21,"titre":"Matchs à 5, à 3 équipes","objectif":"Appliquer en match ce qu'on a travaillé.","consigne":"Je fais en match ce que j'ai appris aujourd'hui.","installation":"Le match à 5 sur le terrain 1 (24 × 34 m) : 2 équipes de 4 joueurs + 1 gardien. En même temps, la 3e équipe joue un 2 contre 2 avec un gardien sur le terrain 2. Un joueur en plus : joker qui attaque ou qui défend, au choix des éducateurs.","deroulement":["Match 1 : équipe 1 contre équipe 2 sur le terrain 1 ; la 3e équipe joue un 2 contre 2 + gardien sur le terrain 2.","Matchs de 10 minutes, comme en compétition. Après chaque match, l'équipe qui a joué 2 fois sort.","Les postes tournent à chaque match, gardien compris.","Jamais de 6 contre 6 : les U8 jouent à 5."],"g1":"Équipes faites par les éducateurs.","g2":"Équipes faites par les éducateurs.","erreurs":["Tout le monde en grappe autour du ballon. « Qui est libre loin du ballon ? »","Le 2 contre 2 du terrain 2 s'arrête pour regarder le match. Un éducateur reste avec lui et compte les buts."],"materiel":"Les 2 terrains et leurs buts, chasubles de 3 couleurs.","img":"img/ex21.jpg","variantes":[{"bloc":3,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Match à 5 (4 joueurs + gardien), matchs de 10 min, postes qui tournent.","regle":"Un but marqué après une-deux compte double. Le reste ne change pas.","dit":"Un but après une-deux compte double.","consigne":"Je passe, je cours, je reçois : une-deux, puis je tire.","g1":"Équipes faites par les éducateurs.","g2":"Équipes faites par les éducateurs.","img":"img/var3_21.jpg"},{"bloc":4,"levier":"Levier 2 · Règle ce qui fait marquer","avant":"Bloc 3 : un but après une-deux compte double.","regle":"La règle de la semaine remplace celle du bloc 3 (même tableau que les multi-matchs). La remise en jeu du gardien reste courte pendant tout le bloc.","dit":"Cette semaine, une seule nouvelle règle : voir le tableau.","consigne":"Je fais en match ce que j'ai appris cette semaine.","g1":"Équipes faites par les éducateurs.","g2":"Équipes faites par les éducateurs.","img":"img/var4_21.jpg"}],"categorie":"match","type_label":"Match","quand":"31 min · MERCREDIS 18 NOVEMBRE, 2 ET 16 DÉCEMBRE","duree":"31 min","principal":false,"nouveau_bloc":2},{"num":22,"titre":"Match à 3 zones","objectif":"Choisir la bonne action selon l'endroit du terrain.","consigne":"Derrière, je passe. Au milieu, j'ose. Devant, je tire ou je centre.","installation":"Terrain 1 (24 × 34 m), coupé en 3 zones par les plots jaunes du Relais 1-2-1 (12 · 10 · 12 m). Dans chaque zone d'attaque, 2 plots jaunes marquent un couloir du milieu de 10 m de large (à 7 m de chaque bord). Matchs à 5 (4 joueurs + 1 gardien). En même temps, la 3e équipe joue un 2 contre 2 avec un gardien sur le terrain 2.","deroulement":["Zone défensive : dribble interdit, passe obligatoire. Sinon, ballon à l'adversaire.","Zone du milieu : le dribble est permis.","Zone d'attaque : dans l'axe, je frappe. Sur le côté, je passe ou je centre vers l'axe.","Le milieu qui donne la passe à l'attaquant reste dans la zone du milieu. L'autre milieu entre dans la zone d'attaque pour aider l'attaquant.","Un but marqué après un centre compte double.","Matchs de 10 minutes à 3 équipes, comme en plateau. Postes qui tournent."],"g1":"2 touches maximum en zone défensive.","g2":"3 touches en zone défensive.","erreurs":["Il dribble dans sa zone défensive. Ballon à l'adversaire et rappel : « Derrière, je passe. »","Il tire depuis le côté, sans angle. « Sur le côté, je centre. »"],"materiel":"Les plots jaunes du Relais 1-2-1, 4 plots jaunes pour l'axe, chasubles.","img":"img/ex22.jpg","variantes":[{"bloc":3,"levier":"Levier 4 · Consigne la phrase dite aux enfants","avant":"Zone défensive : passe obligatoire. Milieu : on ose. Attaque : on tire ou on centre.","regle":"Rien ne change dans le jeu : mêmes 3 zones, mêmes règles par zone. Seule la phrase change.","dit":"Mêmes zones, même règle : j'ajoute un regard avant de recevoir.","consigne":"Je regarde avant de recevoir, puis je choisis la zone.","g1":"2 touches maximum en zone défensive.","g2":"3 touches en zone défensive.","img":"img/var3_22.jpg"},{"bloc":4,"levier":"Levier 3 · Espace carré, zones, terrain","avant":"Bloc 3 : 3 zones (12 · 10 · 12 m) avec une règle par zone.","regle":"On enlève les plots de la zone du milieu et de la zone d'attaque : il ne reste que la zone défensive (12 m), le reste du terrain est libre.","dit":"On enlève les plots : il reste seulement la zone défensive.","consigne":"Je garde ma place, même sans les plots.","g1":"2 touches maximum en zone défensive.","g2":"3 touches en zone défensive.","img":"img/var4_22.jpg"}],"categorie":"match","type_label":"Match","quand":"31 min · MERCREDIS AVANT PLATEAU","duree":"31 min","principal":false,"nouveau_bloc":2},{"num":23,"titre":"Carré « regarde avant »","objectif":"Regarder par-dessus l'épaule avant de recevoir.","consigne":"Avant que le ballon arrive, je regarde derrière moi.","installation":"Dans une moitié de terrain : 2 carrés de 10 × 10 m, 1 joueur par plot.","deroulement":["Le porteur passe au plot voisin, puis suit sa passe : il court au plot où il a passé.","Avant de recevoir, le receveur jette un coup d'œil par-dessus l'épaule, vers le plot suivant.","Il contrôle vers le plot suivant, passe et suit sa passe à son tour.","Changement de sens toutes les 2 minutes."],"g1":"Contrôle orienté, passe et suis, en 2 touches. Pour compliquer : le copain du plot suivant lève une main ou les deux mains, et le receveur dit « un » ou « deux » avant que le ballon arrive.","g2":"Contrôle, passe et suis, touches libres.","erreurs":["Il regarde trop tard. « Avant que le ballon arrive, qu'est-ce qu'il y a derrière toi ? »","Il part avant que sa passe soit partie. « On court quand le ballon a quitté le pied. »"],"materiel":"4 plots, 1 ballon pour 4.","img":"img/ex23.jpg","variantes":[{"bloc":3,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"4 joueurs sur 4 plots, passe et suis, coup d'œil avant de recevoir.","regle":"Un défenseur entre dans le carré, sans prendre le ballon : il se déplace pour gêner la passe. On change de défenseur toutes les 2 minutes.","dit":"Un défenseur entre dans le carré, sans prendre le ballon.","consigne":"Je regarde où est le défenseur avant de recevoir.","g1":"Contrôle orienté, passe et suis, en 2 touches.","g2":"Contrôle, passe et suis, touches libres.","img":"img/var3_23.jpg"},{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : 1 défenseur dans le carré, sans prendre le ballon.","regle":"2 défenseurs dans le carré, sans prendre le ballon : ils se déplacent pour gêner les passes. On change de défenseurs toutes les 2 minutes.","dit":"Un deuxième défenseur entre dans le carré.","consigne":"Je regarde les deux défenseurs avant de recevoir.","g1":"Contrôle orienté, passe et suis, en 2 touches.","g2":"Contrôle, passe et suis, touches libres.","img":"img/var4_23.jpg"}],"categorie":"planb","type_label":"Rechange","quand":"10 min · PLAN B D'UN ATELIER","duree":"10 min","principal":false,"nouveau_bloc":2},{"num":24,"titre":"10 passes sur cible","objectif":"Passer juste, des deux pieds.","consigne":"Intérieur du pied, je vise la porte.","installation":"Dans une moitié de terrain. Porte de 1 m à 5 m du passeur, le partenaire derrière la porte renvoie le ballon.","deroulement":["5 passes du pied droit.","5 passes du pied gauche.","Réussie : le ballon passe entre les plots sans les toucher.","On compte à voix haute, puis on change de rôle."],"g1":"Porte de 1 m à 7 m.","g2":"Porte de 1,5 m à 5 m.","erreurs":["Passe du pointu. « Montre-moi le côté du pied qui fait la passe. »","Il change de pied en cours de série. Garder le pied annoncé jusqu'à la fin de la série."],"materiel":"Par 2 : 2 plots (porte de 1 m), 1 ballon.","img":"img/ex24.jpg","categorie":"planb","type_label":"Rechange","quand":"10 min · PLAN B D'UN ATELIER","duree":"10 min","principal":false,"nouveau_bloc":2},{"num":25,"titre":"2 contre 2 : un presse, un couvre","objectif":"Défendre à deux : un joueur presse le porteur, l'autre couvre derrière lui.","consigne":"Un presse, un couvre : on s'appelle.","installation":"Une moitié de terrain de 24 × 17 m : le but du terrain avec le gardien d'un côté, un mini-but de 3 m sur la ligne du milieu, à 17 m du but. 2 attaquants contre 2 défenseurs ; les autres du groupe attendent derrière le but et derrière le mini-but. Le lundi, une moitié de 20 × 15 m.","deroulement":["Les 2 attaquants partent avec le ballon vers le but.","Le défenseur le plus proche du ballon presse : il va vers le porteur, sans plonger.","L'autre défenseur couvre : il se place 2 à 3 m derrière son partenaire, entre le ballon et le but.","Si les attaquants font une passe, les défenseurs changent de rôle : celui qui était à couvert presse, l'autre couvre.","Si les défenseurs gagnent le ballon, ils marquent dans le mini-but. Après chaque action, les rôles tournent."],"g1":"Les défenseurs s'annoncent à voix haute (« je presse ! », « je couvre ! »), 8 secondes pour marquer.","g2":"L'éducateur crie « presse ! » au défenseur qui doit presser ; 10 secondes pour marquer.","erreurs":["Les 2 défenseurs foncent sur le ballon. « Un seul presse, l'autre reste derrière. »","Le couvreur reste planté, trop loin. « Qui presse ? Qui couvre ? On se parle. »"],"materiel":"Le but du terrain avec le gardien, 1 mini-but, 4 plots pour la ligne de départ, des ballons, chasubles de 2 couleurs.","levier":"Levier 1 · Joueurs (on passe à 2 contre 2 : un presse, un couvre)","img":"img/ex25.jpg","variantes":[{"bloc":4,"levier":"Levier 1 · Joueurs un partenaire ou un adversaire en plus","avant":"Bloc 3 : 2 contre 2, un presse, l'autre couvre.","regle":"Un joueur de plus de chaque côté : 3 contre 3 avec gardien. Un presse, un couvre, le 3e ferme (il se place à côté du couvreur, côté opposé au ballon).","dit":"Un joueur de plus de chaque côté : on défend à trois.","consigne":"J'ai perdu le ballon : je défends tout de suite.","g1":"Les 3 défenseurs s'annoncent à voix haute : « presse, couvre, ferme ».","g2":"Les rôles sont donnés par l'éducateur avant chaque action.","img":"img/var4_25.jpg"}],"categorie":"duel","type_label":"Duel","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":3},{"num":26,"titre":"Duel aller-retour en 2 contre 2","objectif":"Passer vite de la défense à l'attaque quand on gagne le ballon.","consigne":"Je gagne le ballon, j'attaque l'autre but.","installation":"Une moitié de terrain de 24 × 17 m (le lundi 20 × 15 m) avec un mini-but de 3 m à chaque bout (but A et but B). 2 contre 2 dans le terrain, 2 joueurs en attente derrière chaque mini-but.","deroulement":["Les 2 attaquants partent avec un ballon vers le but A.","Les 2 défenseurs défendent le but A (un presse, un couvre).","Si les défenseurs gagnent le ballon, ils attaquent le but B ; les anciens attaquants défendent.","Ballon sorti ou but marqué : l'éducateur lance un nouveau ballon, les 4 joueurs sortent et 4 autres entrent.","Chaque duel dure 20 secondes ; on compte les buts pour la paire."],"g1":"6 secondes pour marquer après avoir gagné le ballon ; le but compte double.","g2":"8 secondes pour marquer après avoir gagné le ballon.","erreurs":["Le défenseur qui gagne le ballon le rend tout de suite. « Tu l'as gagné : attaque l'autre but. »","Les attaquants qui ont perdu le ballon restent plantés. « Que fais-tu quand tu perds le ballon ? Tu défends. »"],"materiel":"2 mini-buts, 4 plots pour le terrain, des ballons, chasubles de 2 couleurs.","levier":"Levier 2 · Règle (le ballon gagné relance l'attaque dans l'autre sens)","img":"img/ex26.jpg","categorie":"duel","type_label":"Duel","quand":"9 à 12 min · ATELIER EN ALTERNANCE","duree":"9–12 min","principal":true,"nouveau_bloc":4}],"seances":[{"bloc":2,"duree":"1 h","date":"2026-11-02","calendrier":"Plateau samedi 7 novembre (P3).","nouveau":"Circuit de motricité, Jonglage, Contrôle-passe-tir, Rondo, Multi-matchs","pauses":"Pause de 4 min : 0:28 avant les multi-matchs. · 0:55 · Bilan 5 min : on boit, un point positif par joueur, une question : « Qu'as-tu appris aujourd'hui ? » · Durées indicatives.","items":[{"heure":"0:00","duree":"5","titre":"Circuit de motricité","tags":["NOUVEAU"],"num":1,"qui":"2 circuits en dehors des terrains : Groupe 1 avec l'éducateur 1, Groupe 2 avec l'éducateur 2.","consigne":"Je saute, je cours, je tiens sur un pied, sans toucher les plots.","plus":""},{"heure":"0:05","duree":"5","titre":"Jonglage","tags":["NOUVEAU"],"num":2,"qui":"Une moitié de terrain par groupe, chaque éducateur note les records.","consigne":"Je bats mon record.","plus":""},{"heure":"0:10","duree":"10","titre":"Contrôle-passe-tir","tags":["NOUVEAU"],"num":5,"qui":"Chaque groupe dans sa moitié de terrain, le même atelier, un éducateur par groupe.","consigne":"Mon contrôle regarde le but.","plus":""},{"heure":"0:20","duree":"8","titre":"Rondo","tags":["NOUVEAU","puis pause 4 min"],"num":10,"qui":"1 carré par groupe, un éducateur par carré.","consigne":"Je me montre
